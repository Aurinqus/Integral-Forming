<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Slice &amp; Sum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>
/* layout: one focused stage at a time on graph paper; levels, givens and hints slide in from the sides */
:root{
  --paper:#EEF2F6; --panel:#FFFFFF; --ink:#152231; --ink-2:#465668; --ink-3:#77869A;
  --grid:#DDE5EE; --rule:#CCD6E2; --accent:#1F5BD0; --accent-soft:#E3ECFC;
  --ref:#B26A04; --ref-soft:#FBEFD9; --good:#17734A; --good-soft:#E1F2E8; --bad:#B23A2C; --bad-soft:#FBE8E5;
  --chip:#E7EDF6; --chip-ink:#1A3561; --field:#FFFFFF; --water:#8DBBE8; --metal:#A7B1BE; --hot:#E2762F; --olive:#5F6E3A;
  --scrim:rgba(14,24,36,.38);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D151F; --panel:#142130; --ink:#E2E9F1; --ink-2:#A6B4C4; --ink-3:#74849B;
  --grid:#172433; --rule:#283849; --accent:#6EA4FF; --accent-soft:#1B2E4D;
  --ref:#F2B245; --ref-soft:#3A2C12; --good:#4DC48A; --good-soft:#123323; --bad:#FF7E6E; --bad-soft:#3E1C18;
  --chip:#1D2D43; --chip-ink:#CFE0FF; --field:#0F1A27; --water:#2B5C8F; --metal:#5C6A7B; --hot:#FF9A4D; --olive:#93A365;
  --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D151F; --panel:#142130; --ink:#E2E9F1; --ink-2:#A6B4C4; --ink-3:#74849B;
  --grid:#172433; --rule:#283849; --accent:#6EA4FF; --accent-soft:#1B2E4D;
  --ref:#F2B245; --ref-soft:#3A2C12; --good:#4DC48A; --good-soft:#123323; --bad:#FF7E6E; --bad-soft:#3E1C18;
  --chip:#1D2D43; --chip-ink:#CFE0FF; --field:#0F1A27; --water:#2B5C8F; --metal:#5C6A7B; --hot:#FF9A4D; --olive:#93A365;
  --scrim:rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.app{max-width:1160px;margin:0 auto}
button{font:inherit}
.bar{display:flex;align-items:center;gap:14px;padding-block:16px 12px;flex-wrap:wrap}
.brand{font-family:var(--f-math);font-size:30px;color:var(--accent);width:42px;height:42px;display:grid;place-items:center;border:1.5px solid var(--accent);border-radius:9px;background:var(--panel);flex:none}
.where{flex:1 1 220px;min-width:0}
.where h1{font-family:var(--f-display);font-weight:600;font-size:28px;margin:2px 0 0;line-height:1.1;text-wrap:balance}
.tags{display:flex;gap:6px}
.tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--chip-ink)}
.tag.int{background:var(--accent-soft);color:var(--accent)}
.tag.der{background:var(--ref-soft);color:var(--ref)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.link{border:0;padding:4px 0;background:none;color:var(--accent);justify-self:start}
.steps{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.stp{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.stp .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--chip);color:var(--chip-ink);font-size:12px;font-weight:600}
.stp[aria-current="true"]{border-color:var(--accent);color:var(--accent);font-weight:500}
.stp[aria-current="true"] .n{background:var(--accent);color:var(--panel)}
.stp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:20px 22px;display:grid;gap:16px;min-width:0}
@media (max-width:520px){.panel{padding:14px}}
.qtext{font-size:17px;max-width:66ch;margin:0;line-height:1.6}
.mv{font-family:var(--f-math);font-style:italic;font-size:1.08em}
.mn{font-family:var(--f-math);font-size:1.08em}
sub{font-size:.72em}
.skey{font-family:var(--f-mono);font-size:.84em;font-style:normal;background:var(--chip);color:var(--chip-ink);padding:1px 6px;border-radius:5px}
.guide{display:grid;gap:7px;padding:12px 16px;background:var(--accent-soft);border-radius:9px;font-size:14.5px;max-width:84ch}
.guide>div{display:grid;grid-template-columns:140px minmax(0,1fr);gap:12px;align-items:baseline}
.guide .gk{font-family:var(--f-display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;font-size:13px;color:var(--accent)}
@media (max-width:520px){.guide>div{grid-template-columns:minmax(0,1fr);gap:0}}
canvas{display:block;width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--panel)}
canvas.scene{height:300px}
canvas.drag{touch-action:none;cursor:ns-resize}
canvas:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px;align-items:start}
.two>*{min-width:0}
.cap{font-size:13.5px;color:var(--ink-2);margin:8px 0 0}
.sl{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2);margin-top:10px}
.sl input{flex:1;accent-color:var(--accent);min-width:0}
.sl output{font-family:var(--f-mono);font-size:13px;min-width:24px;text-align:right;color:var(--ink)}
.controls{display:flex;gap:10px 22px;flex-wrap:wrap;align-items:center}
.controls .sl{margin:0;flex:1 1 220px}
.nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--rule);padding-top:14px}
.build{display:grid;gap:12px;align-content:start}
.palette{display:grid;gap:8px}
.pgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pgroup .gl{font-size:12px;color:var(--ink-3);width:84px;flex:none}
@media (max-width:520px){.pgroup .gl{width:100%}}
.chip{cursor:grab;border:1px solid transparent;background:var(--chip);color:var(--chip-ink);border-radius:7px;padding:4px 10px;min-width:36px;font-size:15px;line-height:1.3;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip.var{background:var(--accent-soft);color:var(--accent)}
.chip.fn{font-family:var(--f-math)}
.chip.key{font-family:var(--f-mono);font-size:13.5px}
.help{font-size:13.5px;color:var(--ink-2);margin:0;max-width:72ch}
.srow{display:grid;gap:4px}
.srow label{font-size:14px;color:var(--ink-2)}
.srow.fin{padding:12px;border:1px dashed var(--accent);border-radius:10px;background:var(--paper)}
.srow.fin label{color:var(--ink)}
.sin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input.fx,input.lim{font-family:var(--f-mono);font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:7px;padding:7px 9px;min-width:0}
input.fx{flex:1 1 220px}
input.lim{width:120px;font-size:14px}
input.pre{flex:0 1 140px}
input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.sval{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);white-space:nowrap}
.preview{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-math);font-size:20px;overflow-x:auto;min-height:30px}
.preview .pl,.mathline .pl{font-family:var(--f-body);font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:.92em}
.frac>span:first-child{padding:0 3px 1px}
.frac>span:last-child{border-top:1.2px solid currentColor;padding:1px 3px 0}
.sq{border-top:1.2px solid currentColor;padding-left:1px}
.ilim{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.6em;line-height:1.15;margin-right:3px}
.isig{font-size:1.5em;vertical-align:middle}
.slot{display:inline-block;min-width:18px;height:20px;border:1.5px dashed var(--ink-3);border-radius:4px;vertical-align:middle}
.perr{font-size:13.5px;color:var(--bad);display:grid;gap:2px}
.perr:empty{display:none}
.note{background:var(--ref-soft);border-left:3px solid var(--ref);padding:10px 14px;font-size:14.5px}
.sentence{font-size:17px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:0;line-height:1.5}
.pill{background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:999px;font-weight:500}
.mathline{margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-math);font-size:18px;color:var(--ink-2);overflow-x:auto}
.readout{margin:0;font-size:14.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.readout b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.setup{margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--f-math);font-size:19px;overflow-x:auto}
.setup .pl{font-family:var(--f-body);font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{padding:12px 16px;border-radius:9px;font-size:15px;display:grid;gap:8px}
.fb.good{background:var(--good-soft)}
.fb.bad{background:var(--bad-soft)}
.fb.info{background:var(--chip)}
.fb p{margin:0}
.fb .head{font-weight:600}
.fb.good .head{color:var(--good)}
.fb.bad .head{color:var(--bad)}
.fb ul{margin:0;padding-left:18px;display:grid;gap:6px}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.hint{border-left:3px solid var(--ref);background:var(--ref-soft);padding:10px 14px;font-size:14.5px}
.hint .hl{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ref)}
.hint p{margin:2px 0 0}
.sol{border:1px solid var(--rule);border-radius:9px;padding:12px 14px;display:grid;gap:10px}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0}
table.kv{border-collapse:collapse;width:100%;font-size:14px}
table.kv td{padding:6px 8px 6px 0;border-top:1px solid var(--rule);vertical-align:top}
table.kv tr:first-child td{border-top:0}
table.kv td.s{width:48px;white-space:nowrap}
table.kv td.v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
table.kv td.d{color:var(--ink-2)}
ul.phys{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
ul.phys li{padding-left:14px;position:relative}
ul.phys li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1.5px;background:var(--ink-3)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;bottom:0;width:min(430px,92vw);background:var(--panel);z-index:50;overflow-y:auto;display:grid;gap:16px;align-content:start;
  padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 1px var(--rule),0 12px 40px rgba(0,0,0,.2);
  visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
.drawer.right{right:0;transform:translateX(105%);padding-right:max(20px,env(safe-area-inset-right,0px))}
.drawer.left{left:0;transform:translateX(-105%);padding-left:max(20px,env(safe-area-inset-left,0px))}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dh h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0}
.dbody{display:grid;gap:14px}
.tier h4{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px 6px}
.plist{display:grid;gap:2px}
.pbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:7px;font-size:14.5px;color:var(--ink);width:100%}
.pbtn:hover{background:var(--chip)}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.pbtn .k{font-family:var(--f-math);font-style:italic;width:16px;text-align:center;color:var(--ink-3);flex:none}
.pbtn .ok{margin-left:auto;color:var(--good);font-size:13px;flex:none}
.chal{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chal li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--rule);border-radius:9px;font-size:14.5px}
.chal li .mk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);flex:none;display:grid;place-items:center;font-size:13px;color:var(--panel)}
.chal li.now{border-color:var(--good);background:var(--good-soft)}
.chal li.now .mk{background:var(--good);border-color:var(--good)}
.chal li .was{margin-left:auto;font-size:12px;color:var(--good);white-space:nowrap}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand" aria-hidden="true">∫</div>
    <button class="btn" id="b-levels" type="button" aria-controls="d-levels">Levels</button>
    <div class="where"><div class="tags"><span class="tag" id="h-tier"></span><span class="tag" id="h-kind"></span></div><h1 id="h-title"></h1></div>
    <div class="tools" id="tools"><button class="btn" id="b-given" type="button" aria-controls="d-given">Given and physics</button><button class="btn" id="b-hints" type="button" aria-controls="d-hints">Hints</button></div>
  </header>

  <div id="prob-ui">
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <main id="stage">
      <section class="panel" data-step="read">
        <p class="qtext" id="r-text"></p>
        <div class="guide" id="r-guide"></div>
        <canvas id="cv-read" class="scene" aria-label="Picture of the problem"></canvas>
        <div class="nav"><span></span><button class="btn primary" type="button" data-go="slice" id="nx-read">Next</button></div>
      </section>

      <section class="panel" data-step="slice" hidden>
        <div class="two">
          <div>
            <canvas id="cv-slice" class="scene" aria-label="The slice you are building"></canvas>
            <p class="cap" id="cap-slice"></p>
            <label class="sl"><span id="lb-probe">Move the slice</span><input type="range" id="sl-probe" min="0" max="1000" step="1" value="500"></label>
            <label class="sl" id="w-n1"><span>Number of pieces</span><input type="range" id="sl-n1" min="1" max="60" step="1" value="12"><output id="o-n1">12</output></label>
          </div>
          <div class="build">
            <div class="palette" id="pal-slice"></div>
            <div id="card" class="build"></div>
            <div class="preview" id="pv-slice"></div>
            <div class="perr" id="er-slice"></div>
            <div class="note" id="note-slice" hidden></div>
          </div>
        </div>
        <div class="nav"><button class="btn" type="button" data-go="read">Back</button><button class="btn primary" type="button" data-go="sum" id="nx-slice">Next</button></div>
      </section>

      <section class="panel" data-step="sum" hidden>
        <div id="sum-int" class="build">
          <p class="sentence" id="sentence"></p>
          <button class="btn link" id="b-pre" type="button"></button>
          <div class="palette" id="pal-sum"></div>
          <p class="mathline" id="mathline"></p>
          <div class="perr" id="er-sum"></div>
        </div>
        <div class="two">
          <canvas id="cv-sum" class="scene" aria-label="The physical picture"></canvas>
          <canvas id="cv-pile" class="scene" aria-label="Your total, piece by piece"></canvas>
        </div>
        <div class="controls">
          <button class="btn primary" id="b-play" type="button">Play</button>
          <label class="sl" id="w-n2"><span>Number of pieces</span><input type="range" id="sl-n2" min="1" max="60" step="1" value="12"><output id="o-n2">12</output></label>
          <label class="sl" id="w-p2"><span id="lb-probe2">Move along</span><input type="range" id="sl-probe2" min="0" max="1000" step="1" value="500"></label>
        </div>
        <p class="readout" id="readout"></p>
        <button class="btn link" id="b-math" type="button">Show the maths view</button>
        <div id="math-w" class="build" hidden>
          <div><canvas id="cv-m1" class="scene"></canvas><p class="cap" id="cap-m1"></p></div>
          <div id="m2-w"><canvas id="cv-m2" class="scene"></canvas><p class="cap" id="cap-m2"></p></div>
        </div>
        <div class="nav"><button class="btn" type="button" data-go="slice">Back</button><button class="btn primary" type="button" data-go="check">Next: check</button></div>
      </section>

      <section class="panel" data-step="check" hidden>
        <p class="setup" id="chk-setup"></p>
        <div class="two">
          <canvas id="cv-cs" class="scene" aria-label="The physical picture with your answer"></canvas>
          <canvas id="cv-cg" class="scene" aria-label="Your total compared with the real one"></canvas>
        </div>
        <div class="actions">
          <button class="btn primary" id="b-check" type="button">Check my answer</button>
          <button class="btn" id="b-play3" type="button">Play</button>
          <button class="btn" id="b-hint-c" type="button">I’d like a hint</button>
        </div>
        <div id="fb"></div>
        <div class="nav"><button class="btn" type="button" data-go="sum">Back</button><span></span></div>
      </section>
    </main>
  </div>

  <main id="sandbox" class="panel" hidden>
    <p class="qtext" id="sb-intro"></p>
    <div class="two">
      <canvas id="sb-graph" class="scene drag" tabindex="0" aria-label="A graph you can shape. Drag the dots, or use the arrow keys."></canvas>
      <canvas id="sb-scene" class="scene" aria-label="What your graph does"></canvas>
    </div>
    <div class="controls">
      <button class="btn primary" id="sb-play" type="button">Play</button>
      <label class="sl"><span id="sb-t-l">Time</span><input type="range" id="sb-t" min="0" max="1000" step="1" value="1000"></label>
      <button class="btn" id="sb-reset" type="button">Reset the shape</button>
    </div>
    <p class="readout" id="sb-read"></p>
    <h3>Try this</h3>
    <ul class="chal" id="sb-ch"></ul>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer left" id="d-levels" aria-label="Levels" inert><div class="dh"><h2>Levels</h2><button class="btn" type="button" data-close>Close</button></div><div class="dbody" id="levels"></div></aside>
<aside class="drawer right" id="d-given" aria-label="Given and physics" inert><div class="dh"><h2>Given and physics</h2><button class="btn" type="button" data-close>Close</button></div><div class="dbody" id="given-body"></div></aside>
<aside class="drawer right" id="d-hints" aria-label="Hints" inert><div class="dh"><h2>Hints</h2><button class="btn" type="button" data-close>Close</button></div><div class="dbody" id="hints-body"></div></aside>

<script id="core">
/* ---------- units ---------- */
const U={none:[0,0,0],m:[1,0,0],kg:[0,1,0],s:[0,0,1],J:[2,1,-2],N:[1,1,-2],W:[2,1,-3],mps:[1,0,-1],mps2:[1,0,-2],mps3:[1,0,-3],
  kgpm:[-1,1,0],rho:[-3,1,0],Pa:[-1,1,-2],m3ps:[3,0,-1],kgps:[0,1,-1],Npm:[0,1,-2],Npm3:[-2,1,-2],G:[3,-1,-2],ps:[0,0,-1],kgm2:[2,1,0]};
const UN=[[U.none,'no units'],[U.m,'m'],[U.kg,'kg'],[U.s,'s'],[U.J,'J'],[U.N,'N'],[U.W,'W'],[U.mps,'m/s'],[U.mps2,'m/s²'],[U.mps3,'m/s³'],
  [U.kgpm,'kg/m'],[U.rho,'kg/m³'],[U.Pa,'Pa'],[U.m3ps,'m³/s'],[U.kgps,'kg/s'],[U.Npm,'N/m'],[U.Npm3,'N/m³'],[U.G,'N·m²/kg²'],[U.ps,'rad/s'],[U.kgm2,'kg·m²'],
  [[2,0,0],'m²'],[[3,0,0],'m³'],[[0,0,-2],'1/s²'],[[-1,0,0],'1/m'],[[2,1,-1],'J·s'],[[1,1,-1],'kg·m/s'],[[-2,1,0],'kg/m²'],[[1,1,0],'kg·m'],[[3,1,-2],'J·m'],[[1,0,1],'m·s'],[[2,0,-1],'m²/s'],[[2,0,-2],'m²/s²'],[[0,1,-2],'N/m'],[[-1,1,-3],'Pa/s'],[[1,1,0],'kg·m']];
const eqd=(a,b)=>a.every((v,i)=>Math.abs(v-b[i])<1e-9);
const addd=(a,b)=>a.map((v,i)=>v+b[i]), subd=(a,b)=>a.map((v,i)=>v-b[i]), zerod=a=>a.every(v=>Math.abs(v)<1e-9);
const SUP='⁻⁰¹²³⁴⁵⁶⁷⁸⁹';
function supS(n){return String(n).replace(/[-0-9]/g,ch=>SUP['-0123456789'.indexOf(ch)]);}
function uName(d){for(const [k,n] of UN) if(eqd(k,d)) return n;
  const nm=['m','kg','s'],parts=[];d.forEach((p,i)=>{if(Math.abs(p)>1e-9){const r=Math.round(p*100)/100;parts.push(nm[i]+(r===1?'':(Number.isInteger(r)?supS(r):'^'+r)));}});return parts.join('·')||'no units';}

/* ---------- numbers ---------- */
function trimZ(s){return (s.includes('.')&&!s.includes('e'))?s.replace(/\.?0+$/,''):s;}
function fmt(x,sig=4){if(x==null||!isFinite(x))return '—';if(x===0)return '0';const a=Math.abs(x);
  if(a>=1e-3&&a<1e4){const s=x.toPrecision(sig);if(!s.includes('e'))return trimZ(s);}
  if(a>=1e4&&a<1e6)return Math.round(x).toLocaleString('en-US');
  let e=Math.floor(Math.log10(a)),ms=trimZ((x/Math.pow(10,e)).toPrecision(sig));
  if(Math.abs(parseFloat(ms))>=10){e++;ms=trimZ((x/Math.pow(10,e)).toPrecision(sig));}
  return ms+'×10'+supS(e);}
function fmtLit(v){return (Number.isInteger(v)&&Math.abs(v)<1e6)?String(v):fmt(v,6);}

/* ---------- expression parser ---------- */
const FUNCS={sin:Math.sin,cos:Math.cos,tan:Math.tan,exp:Math.exp,ln:Math.log,log:Math.log,sqrt:Math.sqrt,atan:Math.atan,asin:Math.asin,acos:Math.acos,abs:Math.abs};
const ALIAS={pi:'π',rho:'ρ',lambda:'λ',beta:'β',alpha:'α',omega:'ω',theta:'θ',sigma:'σ',mu:'μ'};
function PErr(msg){const e=new Error(msg);e.user=true;return e;}
function tokenize(s){
  s=s.replace(/[−–—]/g,'-').replace(/[×·⋅∙*]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3');
  const out=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      if(s[j]==='e'||s[j]==='E'){let k=j+1;if(s[k]==='+'||s[k]==='-')k++;if(/[0-9]/.test(s[k]||'')){j=k;while(j<s.length&&/[0-9]/.test(s[j]))j++;}}
      const str=s.slice(i,j),v=Number(str);if(!isFinite(v)||str==='.')throw PErr(`“${str}” isn’t a number I can read.`);
      out.push({t:'num',v});i=j;continue;}
    if(/[\p{L}_]/u.test(c)){let j=i+1;while(j<s.length&&/[\p{L}\p{N}_]/u.test(s[j])&&s[j]!=='π')j++;if(c==='π')j=i+1;out.push({t:'id',v:s.slice(i,j)});i=j;continue;}
    if('+-*/^(),'.includes(c)){out.push({t:'op',v:c});i++;continue;}
    if(c==='√'){out.push({t:'sqrt'});i++;continue;}
    if(c==='∫'){out.push({t:'id',v:'int'});i++;continue;}
    throw PErr(`“${c}” isn’t something I can use here.`);}
  return out;}
function splitId(id,K){
  if(K.has(id)||FUNCS[id]||id==='int')return [id];
  const am=id.match(/^(pi|rho|lambda|beta|alpha|omega|theta|sigma|mu)(\d*)$/);
  if(am&&K.has(ALIAS[am[1]]+am[2]))return [ALIAS[am[1]]+am[2]];
  const res=[];let i=0;
  while(i<id.length){let found=null;
    for(let j=id.length;j>i;j--){const sub=id.slice(i,j);
      if(K.has(sub)||FUNCS[sub]){found=[sub,j];break;}
      if(ALIAS[sub]&&K.has(ALIAS[sub])){found=[ALIAS[sub],j];break;}}
    if(!found){if(/[0-9]/.test(id[i])){let j=i;while(j<id.length&&/[0-9]/.test(id[j]))j++;res.push({num:+id.slice(i,j)});i=j;continue;}
      throw PErr(`I don’t know the symbol “${id.slice(i)}”. Use the blocks, or separate symbols with spaces.`);}
    res.push(found[0]);i=found[1];}
  return res;}
function parse(src,K){
  const raw=tokenize(src),T=[];
  for(const tk of raw){if(tk.t==='id'){for(const it of splitId(tk.v,K))T.push(typeof it==='string'?{t:'id',v:it}:{t:'num',v:it.num});}else T.push(tk);}
  if(!T.length)return null;
  let p=0;const peek=()=>T[p],next=()=>T[p++];
  const isOp=v=>peek()&&peek().t==='op'&&peek().v===v;
  const need=(v,msg)=>{if(!isOp(v))throw PErr(msg);next();};
  const startsPrimary=()=>{const k=peek();return !!k&&(k.t==='num'||k.t==='id'||k.t==='sqrt'||(k.t==='op'&&k.v==='('));};
  function expr(){let a=term();while(isOp('+')||isOp('-')){const o=next().v;a={t:'bin',op:o,a,b:term()};}return a;}
  function term(){let a=unary();for(;;){if(isOp('*')||isOp('/')){const o=next().v;a={t:'bin',op:o,a,b:unary()};}else if(startsPrimary()){a={t:'bin',op:'*',a,b:power(),imp:true};}else break;}return a;}
  function unary(){if(isOp('-')){next();return {t:'neg',a:unary()};}if(isOp('+')){next();return unary();}return power();}
  function power(){const b=primary();if(isOp('^')){next();return {t:'bin',op:'^',a:b,b:unary()};}return b;}
  function primary(){const k=next();
    if(!k)throw PErr('The expression stops too early: something is missing at the end.');
    if(k.t==='num')return {t:'num',v:k.v};
    if(k.t==='sqrt')return {t:'fn',n:'sqrt',a:primary()};
    if(k.t==='op'&&k.v==='('){const e=expr();need(')','A “(” is never closed.');return e;}
    if(k.t==='id'){
      if(k.v==='int'){need('(','Write a nested integral as ∫(integrand, variable, from, to).');const f=expr();need(',','Nested integral: put a comma after the integrand, then the variable.');
        const vk=next();if(!vk||vk.t!=='id'||!K.has(vk.v))throw PErr('Nested integral: the second part must be a coordinate, like s.');
        need(',','Nested integral: put a comma after the variable, then the lower limit.');const lo=expr();need(',','Nested integral: put a comma after the lower limit, then the upper limit.');const hi=expr();
        need(')','Nested integral: close it with “)”.');return {t:'int',f,v:vk.v,lo,hi};}
      if(FUNCS[k.v]){need('(',`${k.v} needs brackets, like ${k.v}(x).`);const a=expr();need(')',`The bracket after ${k.v} is never closed.`);return {t:'fn',n:k.v,a};}
      return {t:'sym',n:k.v};}
    if(k.t==='op'&&k.v===')')throw PErr('There’s a “)” with nothing to close.');
    if(k.t==='op'&&k.v===',')throw PErr('Commas only belong inside a nested ∫( , , , ).');
    throw PErr(`“${k.v}” needs something on its left.`);}
  const ast=expr();
  if(p<T.length){const k=T[p];throw PErr(k.v===')'?'There’s an extra “)”.':`I can’t place “${k.v}” here.`);}
  return ast;}
function simpson(f,a,b,n){if(a===b)return 0;if(n%2)n++;const h=(b-a)/n;let s=f(a)+f(b);for(let i=1;i<n;i++)s+=(i%2?4:2)*f(a+i*h);return s*h/3;}
function ev(n,env){switch(n.t){
  case 'num':return n.v;
  case 'sym':{const v=env[n.n];if(v===undefined)throw PErr(`“${n.n}” has no value here.`);return v;}
  case 'neg':return -ev(n.a,env);
  case 'bin':{const a=ev(n.a,env),b=ev(n.b,env);switch(n.op){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '/':return a/b;default:return Math.pow(a,b);}}
  case 'fn':return FUNCS[n.n](ev(n.a,env));
  case 'int':{const lo=ev(n.lo,env),hi=ev(n.hi,env);return simpson(x=>{const e=Object.create(env);e[n.v]=x;return ev(n.f,e);},lo,hi,48);}}}
function hasSym(n,names){if(!n)return false;switch(n.t){case 'sym':return names.includes(n.n);case 'num':return false;case 'neg':return hasSym(n.a,names);case 'bin':return hasSym(n.a,names)||hasSym(n.b,names);case 'fn':return hasSym(n.a,names);case 'int':return hasSym(n.lo,names)||hasSym(n.hi,names)||(!names.includes(n.v)&&hasSym(n.f,names))||(hasSym(n.f,names.filter(x=>x!==n.v)));}return false;}
function DErr(msg){const e=new Error(msg);e.user=true;e.dim=true;return e;}
function dimOf(n,D){switch(n.t){
  case 'num':return {d:[0,0,0],c:n.v};
  case 'sym':return {d:D[n.n]||[0,0,0],c:n.n==='π'?Math.PI:null};
  case 'neg':{const r=dimOf(n.a,D);return {d:r.d,c:r.c==null?null:-r.c};}
  case 'bin':{const A=dimOf(n.a,D),B=dimOf(n.b,D),both=A.c!=null&&B.c!=null;
    if(n.op==='+'||n.op==='-'){
      if(A.c===0)return B; if(B.c===0)return A;
      if(!eqd(A.d,B.d))throw DErr(`you’re ${n.op==='+'?'adding':'subtracting'} ${uName(B.d)} ${n.op==='+'?'to':'from'} ${uName(A.d)}, which can’t be combined`);
      return {d:A.d,c:both?(n.op==='+'?A.c+B.c:A.c-B.c):null};}
    if(n.op==='*')return {d:addd(A.d,B.d),c:both?A.c*B.c:null};
    if(n.op==='/')return {d:subd(A.d,B.d),c:both?A.c/B.c:null};
    if(!zerod(B.d))throw DErr('an exponent has units, but exponents must be plain numbers');
    if(zerod(A.d))return {d:[0,0,0],c:both?Math.pow(A.c,B.c):null};
    if(B.c==null)throw DErr('a quantity with units is raised to a power that isn’t a fixed number');
    return {d:A.d.map(x=>x*B.c),c:null};}
  case 'fn':{const A=dimOf(n.a,D);
    if(n.n==='sqrt')return {d:A.d.map(x=>x/2),c:A.c!=null?Math.sqrt(A.c):null};
    if(n.n==='abs')return A;
    if(!zerod(A.d))throw DErr(`${n.n}( ) has ${uName(A.d)} inside it, but it needs a plain number`);
    return {d:[0,0,0],c:null};}
  case 'int':{const F=dimOf(n.f,D);return {d:addd(F.d,D[n.v]||[0,0,0]),c:null};}}}

/* ---------- display ---------- */
function symHTML(n){if(n==='π')return '<span class="mn">π</span>';const m=n.match(/^(.+?)(\d+|max)$/);
  if(m)return `<i class="mv">${m[1]}</i><sub>${m[2]}</sub>`;return `<i class="mv">${n}</i>`;}
const S=symHTML;
function pp(n,parent=0){let s,pr;
  switch(n.t){
    case 'num':s=fmtLit(n.v);pr=5;break;
    case 'sym':s=symHTML(n.n);pr=5;break;
    case 'neg':s='−'+pp(n.a,3);pr=3;break;
    case 'bin':
      if(n.op==='+'||n.op==='-'){s=pp(n.a,1)+(n.op==='+'?' + ':' − ')+pp(n.b,1.5);pr=1;}
      else if(n.op==='*'){const sep=(n.a.t==='num'&&(n.b.t==='num'||(n.b.t==='bin'&&n.b.op==='^'&&n.b.a.t==='num')))?'·':' ';s=pp(n.a,2)+sep+pp(n.b,2.5);pr=2;}
      else if(n.op==='/'){s=`<span class="frac"><span>${pp(n.a,0)}</span><span>${pp(n.b,0)}</span></span>`;pr=4.2;}
      else{s=pp(n.a,4.5)+'<sup>'+pp(n.b,0)+'</sup>';pr=4;}
      break;
    case 'fn':s=n.n==='sqrt'?`√<span class="sq">${pp(n.a,0)}</span>`:`${n.n}(${pp(n.a,0)})`;pr=5;break;
    case 'int':s=`<span class="isig">∫</span><span class="ilim"><span>${pp(n.hi,0)}</span><span>${pp(n.lo,0)}</span></span>${pp(n.f,1.5)} <i class="mv">d</i>${symHTML(n.v)}`;pr=1.2;break;}
  return pr<parent?`(${s})`:s;}

/* ---------- random ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkR(seed){const rnd=mulberry(seed);return (a,b,st)=>{const k=Math.round((b-a)/st),v=a+st*Math.floor(rnd()*(k+1)),d=Math.max(0,-Math.floor(Math.log10(st)+1e-9));return +v.toFixed(d+1);};}

/* ---------- problems ---------- */
const g0=9.81;
const P6=x=>+x.toPrecision(6);
const dx_=`<i class="mv">dx</i>`,dt_=`<i class="mv">dt</i>`,ds_=`<i class="mv">ds</i>`,dy_=`<i class="mv">dy</i>`,dr_=`<i class="mv">dr</i>`;
const TPL=[
/* ================= Warm-up ================= */

 phys:[`Distance covered in a short time: ${dx_} = ${S('v')}·${dt_}`],

 text:`A steel rod of length ${S('L')} gets thicker toward one end. Its mass per metre is ${S('λ0')} at the thin end and rises evenly to ${S('λ1')} at the thick end. What is the rod’s total mass ${S('M')}?`,
 phys:[`Mass of a short piece: <i class="mv">dm</i> = ${S('λ')}·${dx_}, where ${S('λ')} is the mass per metre at that spot`,`A quantity that changes evenly along a length is a straight line: start value + slope × distance`],
 ans:{lhs:S('M'),name:'mass',rate:'Mass per metre at that spot',u:U.kg,f:P=>P.L*(P['λ0']+P['λ1'])/2},
 sol:{f:'λ0 + (λ1 - λ0) x / L',v:'x',lo:'0',hi:'L'},
 guide:[['Graph tip','The height of the line is the mass per metre at each spot, not the mass. A 1 cm piece at the thin end weighs about λ₀ × 0.01 m. The area under the line is the total mass.']],
 hint:`Cut the rod into short pieces of length ${dx_}. A piece at position ${S('x')} has mass ${S('λ')}(${S('x')})·${dx_}. Write ${S('λ')}(${S('x')}) as a straight line that equals ${S('λ0')} at ${S('x')} = 0 and ${S('λ1')} at ${S('x')} = ${S('L')}, then add the pieces from one end to the other.`},

{id:'lift',tier:'Basics',kind:'int',title:'Express elevator',scene:'lift',
 params:r=>({vmax:r(2,6,0.5),T:r(8,20,1)}),
 sym:[['vmax',U.mps,'top speed'],['T',U.s,'length of the ride']],
 vars:[['t',U.s,'time since the doors closed']],
 text:`An express elevator starts and stops at rest. During the ride its speed is ${S('v')}(${S('t')}) = ${S('vmax')}·sin(π${S('t')}/${S('T')}), where ${S('T')} is the length of the ride. How high does it climb?`,
 phys:[`Height gained in a short time: <i class="mv">dh</i> = ${S('v')}·${dt_}`],
 ans:{lhs:'<span class="mn">Δ</span>'+S('h'),name:'height gained',rate:'Height gained per second (the speed)',u:U.m,f:P=>2*P.vmax*P.T/Math.PI},
 sol:{f:'vmax sin(π t / T)',v:'t',lo:'0',hi:'T'},
 hint:`In a short time ${dt_} the cabin rises ${S('v')}·${dt_}. Add these up from the start of the ride (${S('t')} = 0) to the end (${S('t')} = ${S('T')}).`},

{id:'ball',tier:'Basics',kind:'der',title:'Tossed ball',scene:'ball',
 params:r=>({h0:r(1,2,0.1),v0:r(8,20,1)}),
 sym:[['h0',U.m,'launch height'],['v0',U.mps,'launch speed'],['g',U.mps2,'gravitational acceleration',g0]],
 vars:[['t',U.s,'time since the throw']],v:'t',dom:P=>[0,2*P.v0/g0],
 text:`A ball is thrown straight up from height ${S('h0')} with speed ${S('v0')}. Its height is ${S('y')}(${S('t')}) = ${S('h0')} + ${S('v0')}${S('t')} − ½${S('g')}${S('t')}². Build its velocity ${S('v')}(${S('t')}).`,
 phys:[`Velocity: ${S('v')} = ${dy_}/${dt_}`,`Power rule: <i class="mv">d</i>/${dt_} (${S('t')}<sup>${S('n')}</sup>) = ${S('n')}·${S('t')}<sup>${S('n')}−1</sup>`,`The derivative of a constant is 0`],
 ans:{lhs:`${S('v')}(${S('t')})`,name:'velocity',u:U.mps},
 sol:{f:'v0 - g t'},given:{lhs:`${S('y')}(${S('t')})`,name:'height of the ball',f:'h0 + v0 t - g t^2/2',u:U.m,sign:1},
 hint:`Differentiate ${S('y')}(${S('t')}) one term at a time. ${S('h0')} doesn’t change with time, ${S('v0')}${S('t')} changes at a steady rate, and ½${S('g')}${S('t')}² follows the power rule.`},

/* ================= Practical ================= */
{id:'brake',tier:'Practical',kind:'int',title:'Hot brakes',scene:'road',
 params:r=>({v0:r(20,35,1),k:r(0.5,2,0.1)}),
 sym:[['v0',U.mps,'speed when braking starts'],['k',U.mps3,'how fast the deceleration grows']],
 vars:[['t',U.s,'time since braking began'],['s',U.s,'a second time variable, for an integral inside an integral']],
 text:`A car moving at ${S('v0')} brakes hard. As the brake pads heat up, the deceleration grows with time: ${S('a')}(${S('t')}) = −${S('k')}${S('t')}. How far does the car travel before it stops? You’ll need to work out when it stops.`,
 phys:[`Acceleration: ${S('a')} = <i class="mv">dv</i>/${dt_}, so ${S('v')}(${S('t')}) = ${S('v0')} + <span class="mn">∫</span>${S('a')} ${ds_} from 0 to ${S('t')}`,`Distance in a short time: ${dx_} = ${S('v')}·${dt_}`,`The car stops when ${S('v')} = 0`],
 ans:{lhs:S('d'),name:'braking distance',rate:'Distance per second (the speed)',u:U.m,f:P=>{const T=Math.sqrt(2*P.v0/P.k);return 2/3*P.v0*T;}},
 sol:{f:'v0 - k t^2/2',v:'t',lo:'0',hi:'√(2 v0/k)'},
 hint:`First find ${S('v')}(${S('t')}): integrate ${S('a')} from 0 to ${S('t')} and add ${S('v0')}. The car stops when ${S('v')}(${S('t')}) = 0; solve that for ${S('t')} to get your upper limit. Then add up ${S('v')}·${dt_}.`},

{id:'pump',tier:'Practical',kind:'int',title:'Emptying a water tank',scene:'tank',
 params:r=>({R:r(0.5,2,0.1),H:r(2,6,0.5),a:r(0.5,2,0.5)}),
 sym:[['R',U.m,'radius of the tank'],['H',U.m,'height of the tank'],['a',U.m,'height of the outlet above the rim'],['ρ',U.rho,'density of water',1000],['g',U.mps2,'gravitational acceleration',g0]],
 vars:[['y',U.m,'height above the tank bottom']],
 text:`A vertical cylindrical tank with radius ${S('R')} and height ${S('H')} is full of water. A pump lifts the water out through an outlet pipe that ends a height ${S('a')} above the top rim. How much work does the pump do to empty the tank?`,
 phys:[`Work to lift something: ${S('W')} = ${S('F')}·${S('d')}`,`Weight: ${S('F')} = ${S('m')}${S('g')}`,`Mass from density: ${S('m')} = ${S('ρ')}${S('V')}`,`Volume of a thin disc: ${S('V')} = π${S('r')}² × thickness`],
 ans:{lhs:S('W'),name:'work',rate:'Work per metre of height',u:U.J,f:P=>P['ρ']*P.g*Math.PI*P.R*P.R*(P.H*P.H/2+P.a*P.H)},
 sol:{f:'ρ g π R^2 (H + a - y)',v:'y',lo:'0',hi:'H'},
 hint:`Slice the water into thin discs of thickness ${dy_}. A disc at height ${S('y')} has volume π${S('R')}²·${dy_}, weight ${S('ρ')}${S('g')} times that, and must be lifted from ${S('y')} up to the outlet at ${S('H')} + ${S('a')}.`},

{id:'dam',tier:'Practical',kind:'int',title:'Sluice gate',scene:'dam',
 params:r=>{const D=r(8,30,1);return {w:r(2,8,0.5),D,b:Math.max(1,Math.round(r(0.2,0.6,0.1)*D*2)/2)};},
 sym:[['w',U.m,'width of the gate'],['b',U.m,'height of the gate, measured up from the floor'],['D',U.m,'depth of the water'],['ρ',U.rho,'density of water',1000],['g',U.mps2,'gravitational acceleration',g0]],
 vars:[['y',U.m,'height above the reservoir floor']],
 text:`A dam holds back a reservoir of depth ${S('D')}. At the foot of the dam is a rectangular sluice gate, ${S('w')} wide and ${S('b')} tall, starting at the reservoir floor. Water pressure grows with depth. Find the total force the water puts on the gate.`,
 phys:[`Pressure at depth ${S('h')} below the surface: ${S('p')} = ${S('ρ')}${S('g')}${S('h')}`,`Force from pressure on a flat area: ${S('F')} = ${S('p')}${S('A')}`,`Area of a thin horizontal strip: ${S('A')} = width × height of the strip`],
 ans:{lhs:S('F'),name:'force on the gate',rate:'Force per metre of height',u:U.N,f:P=>P['ρ']*P.g*P.w*(P.D*P.b-P.b*P.b/2)},
 sol:{f:'ρ g (D - y) w',v:'y',lo:'0',hi:'b'},
 hint:`Cut the gate into horizontal strips of height ${dy_}. A strip at height ${S('y')} sits at depth ${S('D')} − ${S('y')}, so it feels pressure ${S('ρ')}${S('g')}(${S('D')} − ${S('y')}) over an area ${S('w')}·${dy_}. The gate runs from the floor up to ${S('b')}.`},

{id:'cone',tier:'Practical',kind:'der',title:'Filling a cone tank',scene:'cone',
 params:r=>({R:r(1,3,0.5),H:r(2,5,0.5),Q:r(0.05,0.3,0.01)}),
 sym:[['R',U.m,'radius at the top'],['H',U.m,'height of the tank'],['Q',U.m3ps,'inflow rate']],
 vars:[['h',U.m,'depth of the water']],v:'h',dom:P=>[0.15*P.H,P.H],
 text:`A cone-shaped tank stands point-down. It has top radius ${S('R')} and height ${S('H')}. Water flows in at a steady rate ${S('Q')}. Build <i class="mv">dh</i>/${dt_}, how fast the water level rises, as a function of the water depth ${S('h')}.`,
 phys:[`Volume of a cone: ${S('V')} = ⅓π${S('r')}²${S('h')}`,`Similar triangles: at any depth, ${S('r')}/${S('h')} = ${S('R')}/${S('H')}`,`Chain rule: <i class="mv">dV</i>/${dt_} = (<i class="mv">dV</i>/<i class="mv">dh</i>)·(<i class="mv">dh</i>/${dt_})`,`The inflow sets <i class="mv">dV</i>/${dt_} = ${S('Q')}`],
 ans:{lhs:`<i class="mv">dh</i>/${dt_}`,name:'speed the water level rises',u:U.mps},
 sol:{f:'Q H^2 / (π R^2 h^2)'},
 hint:`Use ${S('r')} = ${S('R')}${S('h')}/${S('H')} to write the water volume with ${S('h')} only. Differentiate both sides with respect to time using the chain rule, set <i class="mv">dV</i>/${dt_} = ${S('Q')}, and solve for <i class="mv">dh</i>/${dt_}.`},

/* ================= Physics ================= */
{id:'spring',tier:'Physics',kind:'int',title:'Stiffening spring',scene:'spring',
 params:r=>({k:r(50,200,10),'β':r(500,3000,100),X:r(0.1,0.4,0.05)}),
 sym:[['k',U.Npm,'linear stiffness'],['β',U.Npm3,'how much it stiffens'],['X',U.m,'final extension']],
 vars:[['x',U.m,'extension from rest length']],
 text:`A heavy-duty spring stiffens as it stretches. The force needed to hold it at extension ${S('x')} is ${S('F')}(${S('x')}) = ${S('k')}${S('x')} + ${S('β')}${S('x')}³. How much work does it take to stretch it from its rest length to an extension ${S('X')}?`,
 phys:[`Work over a short distance: <i class="mv">dW</i> = ${S('F')}·${dx_}`,`${S('W')} = ${S('F')}·${S('d')} only works when the force stays constant`],
 ans:{lhs:S('W'),name:'work',rate:'Work per metre of stretch (the force)',u:U.J,f:P=>P.k*P.X*P.X/2+P['β']*P.X**4/4},
 sol:{f:'k x + β x^3',v:'x',lo:'0',hi:'X'},
 hint:`The force changes as the spring stretches, so split the stretch into short steps ${dx_}. Each step costs ${S('F')}(${S('x')})·${dx_} of work. Add them from ${S('x')} = 0 to ${S('x')} = ${S('X')}.`},

{id:'orbit',tier:'Physics',kind:'int',title:'Lifting to orbit',scene:'earth',
 params:r=>({m:r(500,3000,100),h:r(200,2000,100)*1000}),
 sym:[['G',U.G,'gravitational constant',6.674e-11],['M',U.kg,'mass of Earth',5.972e24],['m',U.kg,'mass of the satellite'],['R',U.m,'radius of Earth',6.371e6],['h',U.m,'altitude to reach']],
 vars:[['r',U.m,'distance from Earth’s centre']],
 text:`Far from the ground, gravity is weaker than at the surface. How much work does it take to lift a satellite of mass ${S('m')} from Earth’s surface to an altitude ${S('h')}? Count only the lifting, not the speed it needs to stay in orbit.`,
 phys:[`Newton’s gravity: ${S('F')} = ${S('G')}${S('M')}${S('m')}/${S('r')}², where ${S('r')} is the distance from Earth’s centre`,`Work over a short distance: <i class="mv">dW</i> = ${S('F')}·${dr_}`],
 ans:{lhs:S('W'),name:'work',rate:'Work per metre (the force)',u:U.J,f:P=>P.G*P.M*P.m*(1/P.R-1/(P.R+P.h))},
 sol:{f:'G M m / r^2',v:'r',lo:'R',hi:'R + h'},
 hint:`Measure position by ${S('r')}, the distance from Earth’s centre. The satellite goes from ${S('r')} = ${S('R')} to ${S('r')} = ${S('R')} + ${S('h')}, and over each step ${dr_} the force is ${S('G')}${S('M')}${S('m')}/${S('r')}².`},

{id:'disc',tier:'Physics',kind:'int',title:'Spinning disc',scene:'disc',
 params:r=>({M:r(1,10,0.5),R:r(0.1,0.5,0.05)}),
 sym:[['M',U.kg,'mass of the disc'],['R',U.m,'radius of the disc']],
 vars:[['r',U.m,'distance from the centre']],
 text:`A uniform solid disc with mass ${S('M')} and radius ${S('R')} spins about its centre. Build its moment of inertia ${S('I')} by adding up thin rings.`,
 phys:[`A thin ring of mass <i class="mv">dm</i> at radius ${S('r')}: <i class="mv">dI</i> = ${S('r')}²·<i class="mv">dm</i>`,`Mass per area of a uniform disc: ${S('σ')} = mass ÷ area`,`Area of a circle: ${S('A')} = π${S('r')}²`,`A thin ring’s area is about its circumference × its width`],
 ans:{lhs:S('I'),name:'moment of inertia',rate:'Moment of inertia per metre of radius',u:U.kgm2,f:P=>P.M*P.R*P.R/2},
 sol:{f:'r^2 M/(π R^2) 2 π r',v:'r',lo:'0',hi:'R'},
 hint:`A ring at radius ${S('r')} with width ${dr_} has area 2π${S('r')}·${dr_}. Its mass is ${S('σ')} times that area, with ${S('σ')} = ${S('M')}/(π${S('R')}²). Multiply the ring’s mass by ${S('r')}² and add rings from the centre to the edge.`},

{id:'lj',tier:'Physics',kind:'der',title:'Force between two atoms',scene:'atoms',
 params:r=>({U0:P6(r(1,3,0.1)*1e-21),a:P6(r(0.3,0.4,0.01)*1e-9)}),
 sym:[['U0',U.J,'depth of the energy well'],['a',U.m,'separation with the lowest energy']],
 vars:[['x',U.m,'distance between the atoms']],v:'x',dom:P=>[0.92*P.a,2.2*P.a],
 text:`Two atoms interact through the Lennard-Jones potential ${S('U')}(${S('x')}) = ${S('U0')}·((${S('a')}/${S('x')})¹² − 2(${S('a')}/${S('x')})⁶), where ${S('x')} is the distance between them. The force is ${S('F')} = −<i class="mv">dU</i>/${dx_}, positive when they push apart. Build ${S('F')}(${S('x')}).`,
 phys:[`Force from potential energy: ${S('F')} = −<i class="mv">dU</i>/${dx_}`,`Power rule: <i class="mv">d</i>/${dx_} (${S('x')}<sup>${S('n')}</sup>) = ${S('n')}·${S('x')}<sup>${S('n')}−1</sup>`,`(${S('a')}/${S('x')})<sup>${S('n')}</sup> = ${S('a')}<sup>${S('n')}</sup>·${S('x')}<sup>−${S('n')}</sup>`],
 ans:{lhs:`${S('F')}(${S('x')})`,name:'force between the atoms',u:U.N},
 sol:{f:'12 U0 / x ((a/x)^12 - (a/x)^6)'},given:{lhs:`${S('U')}(${S('x')})`,name:'potential energy',f:'U0 ((a/x)^12 - 2 (a/x)^6)',u:U.J,sign:-1},
 hint:`Rewrite each (${S('a')}/${S('x')})<sup>${S('n')}</sup> as ${S('a')}<sup>${S('n')}</sup>${S('x')}<sup>−${S('n')}</sup> so the power rule applies. Differentiate both terms, then flip the sign to get ${S('F')}.`},

/* ================= Extreme ================= */
{id:'rocket',tier:'Extreme',kind:'int',title:'Interceptor burn',scene:'rocket',
 params:r=>{const m0=r(800,2000,100),q=r(2,8,0.5);return {u:r(2000,3500,100),m0,q,T:Math.round(r(0.4,0.7,0.05)*m0/q)};},
 sym:[['u',U.mps,'exhaust speed'],['q',U.kgps,'fuel burned per second'],['m0',U.kg,'starting mass'],['T',U.s,'burn time']],
 vars:[['t',U.s,'time since ignition'],['s',U.s,'a second time variable, for an integral inside an integral']],
 text:`Your interceptor starts at rest in deep space, far from any gravity. Its engine burns fuel at ${S('q')} kilograms per second with exhaust speed ${S('u')}. As the craft gets lighter it accelerates harder: ${S('a')}(${S('t')}) = ${S('u')}${S('q')}/(${S('m0')} − ${S('q')}${S('t')}). How far has it travelled when the engine cuts off at ${S('t')} = ${S('T')}? That distance decides where it can meet the asteroid.`,
 phys:[`${S('a')} = <i class="mv">dv</i>/${dt_} and ${S('v')} = ${dx_}/${dt_}`,`Starting from rest, velocity is the accumulated acceleration`,`<span class="mn">∫</span> 1/(${S('c')} − ${S('q')}${S('s')}) ${ds_} = −(1/${S('q')})·ln(${S('c')} − ${S('q')}${S('s')})`],
 ans:{lhs:`${S('x')}(${S('T')})`,name:'distance',rate:'Distance per second (the speed)',u:U.m,f:P=>{const m1=P.m0-P.q*P.T;return P.u*(P.T-(m1/P.q)*Math.log(P.m0/m1));}},
 sol:{f:'u ln(m0/(m0 - q t))',v:'t',lo:'0',hi:'T'},
 hint:`It takes two steps. Velocity is the sum of ${S('a')}(${S('s')})·${ds_} from 0 to ${S('t')}. Position is the sum of ${S('v')}(${S('t')})·${dt_} from 0 to ${S('T')}. Either integrate ${S('a')} by hand first, or put one ∫ inside the other with the nested ∫ block.`},

{id:'track',tier:'Extreme',kind:'int',title:'Predicting the asteroid',scene:'track',fx:['sin'],
 params:r=>({x0:r(20,80,5)*1000,v0:r(5,20,1),'α':r(0.01,0.05,0.005),'ω':Math.round(2*Math.PI/r(200,600,50)*1e5)/1e5,T:r(600,1800,100)}),
 sym:[['x0',U.m,'distance when first tracked'],['v0',U.mps,'speed away from you when first tracked'],['α',U.mps2,'strength of the periodic push'],['ω',U.ps,'angular frequency of the push'],['T',U.s,'how far ahead to predict']],
 vars:[['t',U.s,'time since first tracked'],['s',U.s,'a second time variable, for an integral inside an integral']],
 text:`Radar puts an asteroid at distance ${S('x0')} along your tracking line, moving away at ${S('v0')}. Sunlight heating its surface adds a small periodic push, ${S('a')}(${S('t')}) = ${S('α')}·sin(${S('ω')}${S('t')}). Predict where it will be at time ${S('T')}, so the interceptor can be aimed there.`,
 phys:[`Position = starting position + distance covered since`,`Velocity = starting velocity + accumulated acceleration`,`<span class="mn">∫</span> sin(${S('ω')}${S('s')}) ${ds_} = −cos(${S('ω')}${S('s')})/${S('ω')}`],
 ans:{lhs:`${S('x')}(${S('T')})`,name:'position',rate:'Distance covered per second (the speed)',u:U.m,f:P=>P.x0+P.v0*P.T+P['α']/P['ω']*(P.T-Math.sin(P['ω']*P.T)/P['ω'])},
 sol:{pre:'x0',f:'v0 + α (1 - cos(ω t))/ω',v:'t',lo:'0',hi:'T'},
 hint:`Start from the known position ${S('x0')} and add the distance covered. The velocity at time ${S('t')} is ${S('v0')} plus the integral of ${S('a')}(${S('s')}) from 0 to ${S('t')}. That velocity goes inside an integral from 0 to ${S('T')}, and ${S('x0')} goes in a term outside the integral.`},

{id:'los',tier:'Extreme',kind:'der',title:'Line-of-sight rate',scene:'los',
 params:r=>({D:r(5,50,1)*1000,u:r(2,15,0.5)*1000}),
 sym:[['D',U.m,'closest distance of the path'],['u',U.mps,'speed of the asteroid']],
 vars:[['t',U.s,'time from closest approach']],v:'t',dom:P=>[-3*P.D/P.u,3*P.D/P.u],
 text:`A tracking station watches an asteroid fly past on a straight path. The path comes no closer than ${S('D')}, the asteroid moves at speed ${S('u')}, and closest approach happens at ${S('t')} = 0. The line-of-sight angle is ${S('θ')}(${S('t')}) = atan(${S('u')}${S('t')}/${S('D')}). Proportional navigation steers an interceptor by how fast this angle turns. Build <i class="mv">dθ</i>/${dt_}.`,
 phys:[`Chain rule: <i class="mv">d</i>/${dt_} ${S('f')}(${S('z')}(${S('t')})) = ${S('f')}′(${S('z')})·${S('z')}′(${S('t')})`,`<i class="mv">d</i>/<i class="mv">dz</i> atan(${S('z')}) = 1/(1 + ${S('z')}²)`],
 ans:{lhs:`<i class="mv">dθ</i>/${dt_}`,name:'turn rate of the sightline',u:U.ps},
 sol:{f:'(u/D) / (1 + (u t/D)^2)'},given:{lhs:`${S('θ')}(${S('t')})`,name:'sightline angle',f:'atan(u t / D)',u:U.none,uLabel:'rad',sign:1},
 hint:`Let ${S('z')} = ${S('u')}${S('t')}/${S('D')}. Then ${S('θ')} = atan(${S('z')}), so <i class="mv">dθ</i>/${dt_} = (<i class="mv">dθ</i>/<i class="mv">dz</i>)·(<i class="mv">dz</i>/${dt_}).`},

/* ================= Military ================= */
{id:'tank',tier:'Military',kind:'int',title:'Tank pulls away',scene:'mover',icon:'tank',
 params:r=>({vmax:r(15,20,0.5),'τ':r(4,10,0.5),T:r(10,40,5)}),
 sym:[['vmax',U.mps,'top speed'],['τ',U.s,'sets how quickly it reaches top speed'],['T',U.s,'how long to watch it']],
 vars:[['t',U.s,'time since it started moving']],
 text:`A 60-tonne main battle tank pulls away from a standstill. Its speed climbs toward a top speed ${S('vmax')} and then levels off: ${S('v')}(${S('t')}) = ${S('vmax')}·(1 − e<sup>−${S('t')}/${S('τ')}</sup>). How far does it travel in the first ${S('T')} seconds?`,
 phys:[`Distance covered in a short time: ${dx_} = ${S('v')}·${dt_}`,`Type e<sup>−${S('t')}/${S('τ')}</sup> as exp(−t/τ)`],
 ans:{lhs:S('d'),name:'distance',rate:'Distance per second (the speed)',u:U.m,f:P=>P.vmax*(P.T-P['τ']*(1-Math.exp(-P.T/P['τ'])))},
 sol:{f:'vmax (1 - exp(-t/τ))',v:'t',lo:'0',hi:'T'},
 guide:[['Graph tip','The speed line rises quickly, then flattens out near top speed. The area under it is the distance.']],
 pos:(P,t)=>P.vmax*(t-P['τ']*(1-Math.exp(-t/P['τ']))),posEnd:P=>P.vmax*(P.T-P['τ']*(1-Math.exp(-P.T/P['τ']))),
 hint:`In a short moment ${dt_} the tank moves ${S('v')}(${S('t')})·${dt_}. Put the speed formula in as the integrand and add from ${S('t')} = 0 to ${S('t')} = ${S('T')}. You don’t need to integrate the exponential by hand; the app does the adding.`},

{id:'recoil',tier:'Military',kind:'int',title:'Field gun recoil',scene:'recoil',
 params:r=>({F0:P6(r(2,6,0.5)*1e5),'τ':P6(r(5,15,1)*1e-3),M:r(800,2000,100)}),
 sym:[['F0',U.N,'push on the barrel at the moment of firing'],['τ',U.s,'how long the push lasts'],['M',U.kg,'mass of the recoiling parts']],
 vars:[['t',U.s,'time since firing']],
 text:`When a field gun fires, the propellant gas shoves the barrel backwards. The push falls off quickly: ${S('F')}(${S('t')}) = ${S('F0')}·(1 − ${S('t')}/${S('τ')})² for the ${S('τ')} seconds it lasts. The recoiling parts have mass ${S('M')} and start at rest. How fast are they moving backwards when the push ends?`,
 phys:[`Newton’s second law: ${S('F')} = ${S('M')}${S('a')}, so ${S('a')} = ${S('F')}/${S('M')}`,`Speed gained in a short time: <i class="mv">dv</i> = ${S('a')}·${dt_}`],

{id:'muzzle',tier:'Military',kind:'int',title:'Muzzle energy',scene:'barrel',
 params:r=>({F0:P6(r(1,4,0.5)*1e6),L0:r(0.2,0.6,0.1),Lb:r(3,6,0.5)}),

 text:`Inside a gun barrel, expanding gas pushes the shell forward. As the gas expands the push weakens: ${S('F')}(${S('x')}) = ${S('F0')}·${S('L0')}/(${S('L0')} + ${S('x')}), where ${S('x')} is how far the shell has moved. The barrel is ${S('Lb')} long. How much kinetic energy does the shell have when it leaves the muzzle?`,
 phys:[`Work over a short distance: <i class="mv">dW</i> = ${S('F')}·${dx_}`,`Work done on something that starts at rest becomes its kinetic energy`],
 ans:{lhs:'<i class="mv">E</i><sub>k</sub>',name:'kinetic energy',rate:'Energy per metre of barrel (the force)',u:U.J,f:P=>P.F0*P.L0*Math.log((P.L0+P.Lb)/P.L0)},

{id:'drag',tier:'Military',kind:'int',title:'Shell slowed by air',scene:'mover',icon:'shell',
 params:r=>({u0:r(300,700,50),k:r(0.01,0.05,0.005),T:r(10,40,5)}),
 sym:[['u0',U.mps,'horizontal speed leaving the gun'],['k',U.ps,'how strongly the air slows it'],['T',U.s,'flight time']],
 vars:[['t',U.s,'time since it left the gun']],
 text:`An artillery shell leaves the gun with horizontal speed ${S('u0')}. Air drag slows it, so its horizontal speed is ${S('u')}(${S('t')}) = ${S('u0')}·e<sup>−${S('k')}${S('t')}</sup>. How far does it travel horizontally during a flight lasting ${S('T')}?`,
 phys:[`Horizontal distance in a short time: ${dx_} = ${S('u')}·${dt_}`,`Type e<sup>−${S('k')}${S('t')}</sup> as exp(−k t)`],
 ans:{lhs:S('d'),name:'horizontal distance',rate:'Distance per second (the speed)',u:U.m,f:P=>P.u0*(1-Math.exp(-P.k*P.T))/P.k},
 sol:{f:'u0 exp(-k t)',v:'t',lo:'0',hi:'T'},
 pos:(P,t)=>P.u0*(1-Math.exp(-P.k*t))/P.k,posEnd:P=>P.u0*(1-Math.exp(-P.k*P.T))/P.k,
 hint:`In a short moment ${dt_} the shell moves ${S('u')}(${S('t')})·${dt_} sideways. Use the speed formula as the integrand and add over the whole flight.`},

{id:'drone',tier:'Military',kind:'der',title:'Incoming drone',scene:'drone',
 params:r=>({D:r(1,5,0.5)*1000,u:r(30,80,5)}),
 sym:[['D',U.m,'closest distance of the drone’s path'],['u',U.mps,'speed of the drone']],
 vars:[['t',U.s,'time from closest approach']],v:'t',dom:P=>[-4*P.D/P.u,4*P.D/P.u],
 text:`A drone flies a straight line that passes a radar at closest distance ${S('D')}, at speed ${S('u')}. Closest approach is at ${S('t')} = 0, so its distance from the radar is ${S('r')}(${S('t')}) = √(${S('D')}² + (${S('u')}${S('t')})²). Build ${dr_}/${dt_}, the rate the distance changes. It should be negative while the drone is approaching.`,
 phys:[`Chain rule: <i class="mv">d</i>/${dt_} √(${S('z')}) = (1/(2√${S('z')}))·<i class="mv">dz</i>/${dt_}`,`<i class="mv">d</i>/${dt_} (${S('u')}${S('t')})² = 2${S('u')}²${S('t')}`],
 ans:{lhs:`${dr_}/${dt_}`,name:'rate the distance changes',u:U.mps},
 sol:{f:'u^2 t / √(D^2 + (u t)^2)'},given:{lhs:`${S('r')}(${S('t')})`,name:'distance from the radar',f:'√(D^2 + (u t)^2)',u:U.m,sign:1},
 hint:`The inside of the root is ${S('z')} = ${S('D')}² + (${S('u')}${S('t')})². Its derivative is 2${S('u')}²${S('t')}. Multiply that by 1/(2√${S('z')}).`},

{id:'sub',tier:'Military',kind:'der',title:'Diving submarine',scene:'sub',
 params:r=>({Z:r(100,300,20),'ω':Math.round(Math.PI/r(300,900,60)*1e5)/1e5}),
 sym:[['Z',U.m,'final depth'],['ω',U.ps,'sets how long the dive takes'],['p0',U.Pa,'air pressure at the surface',101325],['ρ',U.rho,'density of seawater',1025],['g',U.mps2,'gravitational acceleration',g0]],
 vars:[['t',U.s,'time since the dive began']],v:'t',dom:P=>[0,Math.PI/P['ω']],
 text:`A submarine dives along a smooth path. Its depth is ${S('z')}(${S('t')}) = ${S('Z')}·(1 − cos(${S('ω')}${S('t')}))/2, levelling off at depth ${S('Z')}. The water pressure on the hull is ${S('p')} = ${S('p0')} + ${S('ρ')}${S('g')}${S('z')}. Build <i class="mv">dp</i>/${dt_}, how fast the pressure on the hull is rising.`,
 phys:[`Chain rule: <i class="mv">dp</i>/${dt_} = (<i class="mv">dp</i>/<i class="mv">dz</i>)·(<i class="mv">dz</i>/${dt_})`,`<i class="mv">d</i>/${dt_} cos(${S('ω')}${S('t')}) = −${S('ω')}·sin(${S('ω')}${S('t')})`,`The derivative of a constant is 0`],
 ans:{lhs:`<i class="mv">dp</i>/${dt_}`,name:'rate the pressure rises',u:[-1,1,-3]},
 sol:{f:'ρ g Z ω sin(ω t)/2'},given:{lhs:`${S('p')}(${S('t')})`,name:'pressure on the hull',f:'p0 + ρ g Z (1 - cos(ω t))/2',u:U.Pa,sign:1},
 hint:`${S('p0')} is constant, so it drops out. <i class="mv">dp</i>/<i class="mv">dz</i> = ${S('ρ')}${S('g')}. Then differentiate ${S('z')}(${S('t')}): the 1 vanishes and −cos(${S('ω')}${S('t')}) becomes ${S('ω')}·sin(${S('ω')}${S('t')}).`},

{id:'gap',tier:'Military',kind:'int',title:'Intercept course',scene:'intercept',
 params:r=>{const D0=r(3,8,0.5)*1000,u=r(40,80,5),j=r(5,20,1);let a=0,b=1000;for(let i=0;i<80;i++){const m=(a+b)/2;if(u*m+j*m**3/6<D0)a=m;else b=m;}return {D0,u,j,T:Math.max(2,Math.round(a*r(0.4,0.8,0.1)))};},
 sym:[['D0',U.m,'starting distance to the drone'],['u',U.mps,'speed of the drone toward you'],['j',U.mps3,'how fast the interceptor’s acceleration grows'],['T',U.s,'time to check']],
 vars:[['t',U.s,'time since launch'],['s',U.s,'a second time variable, for an integral inside an integral']],
 text:`An enemy drone is ${S('D0')} away and flying straight at you at speed ${S('u')}. You launch an interceptor from rest toward it. Its motor ramps up, so its acceleration grows with time: ${S('a')}(${S('t')}) = ${S('j')}${S('t')}. Find the gap between them at time ${S('T')}. A negative answer would mean they have already met.`,
 phys:[`Each second the gap shrinks by the drone’s speed plus the interceptor’s speed`,`Interceptor speed, starting from rest: ${S('v')}(${S('t')}) = <span class="mn">∫</span>${S('a')} ${ds_} from 0 to ${S('t')}`],
 ans:{lhs:'gap',name:'gap',rate:'Change in the gap per second',u:U.m,f:P=>P.D0-P.u*P.T-P.j*P.T**3/6},
 sol:{pre:'D0',f:'-(u + j t^2/2)',v:'t',lo:'0',hi:'T'},
 hint:`Start from ${S('D0')} in the outside term. Each moment ${dt_} the gap changes by −(${S('u')} + ${S('v')}(${S('t')}))·${dt_}, where ${S('v')}(${S('t')}) = ${S('j')}${S('t')}²/2 is the interceptor’s speed. Put that negative rate inside the integral from 0 to ${S('T')}.`},
];
const TIERS=['Warm-up','Basics','Practical','Physics','Extreme','Military'];

function knownOf(t){return new Set(['π',...t.sym.map(s=>s[0]),...t.vars.map(v=>v[0])]);}
function dimsOf(t){const d={'π':U.none};for(const s of t.sym)d[s[0]]=s[1];for(const v of t.vars)d[v[0]]=v[1];return d;}
function mkParams(t,seed){const raw=t.params(mkR(seed)),P={'π':Math.PI};for(const s of t.sym)P[s[0]]=s[3]!==undefined?s[3]:raw[s[0]];return P;}
function envOf(t,P){const e={'π':Math.PI};for(const s of t.sym)e[s[0]]=P[s[0]];return e;}
function fnOf(ast,env,v){return x=>{const e=Object.create(env);e[v]=x;return ev(ast,e);};}

<script id="ui">
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),near=(a,b,r)=>Math.abs(a-b)<=r*Math.abs(b);
/* ---------- colours ---------- */
function colors(){const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim();
  return {ink:g('--ink'),ink2:g('--ink-2'),ink3:g('--ink-3'),rule:g('--rule'),grid:g('--grid'),acc:g('--accent'),ref:g('--ref'),panel:g('--panel'),
    water:g('--water'),metal:g('--metal'),hot:g('--hot'),olive:g('--olive'),good:g('--good'),bad:g('--bad'),paper:g('--paper')};}

/* ---------- canvas helpers ---------- */
function prep(cv){const W=cv.clientWidth||300,H=cv.clientHeight||260,d=window.devicePixelRatio||1;
  if(cv.width!==Math.round(W*d)||cv.height!==Math.round(H*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d);}
  const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);g.globalAlpha=1;g.setLineDash([]);return {g,W,H};}
function txt(g,s,x,y,col,align='left',size=12,math=false,base='middle'){g.fillStyle=col;g.font=`${math?'italic ':''}${size}px ${math?'"STIX Two Text",serif':'"IBM Plex Sans",sans-serif'}`;g.textAlign=align;g.textBaseline=base;g.fillText(s,x,y);}
function arrow(g,x1,y1,x2,y2,col,w=2,head=7){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  const a=Math.atan2(y2-y1,x2-x1);if(Math.hypot(x2-x1,y2-y1)<2)return;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-head*Math.cos(a-0.42),y2-head*Math.sin(a-0.42));g.lineTo(x2-head*Math.cos(a+0.42),y2-head*Math.sin(a+0.42));g.closePath();g.fill();}
function line(g,x1,y1,x2,y2,col,w=1.5,dash){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);}
function bracketV(g,x,y1,y2,col){line(g,x,y1,x,y2,col,2);line(g,x-4,y1,x+4,y1,col,2);line(g,x-4,y2,x+4,y2,col,2);}
function bracketH(g,y,x1,x2,col){line(g,x1,y,x2,y,col,2);line(g,x1,y-4,x1,y+4,col,2);line(g,x2,y-4,x2,y+4,col,2);}
function niceTicks(a,b,n){const span=b-a;if(!(span>0))return [a];const s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),nm=s0/mag,step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;
  const t=[];for(let v=Math.ceil(a/step-1e-9)*step;v<=b+step*1e-9;v+=step)t.push(Math.abs(v)<step*1e-9?0:v);return t;}

/* ---------- plots ---------- */
function plot(cv,o){const {g,W,H}=prep(cv),c=colors(),L=62,R=16,T=o.legend?44:26,B=34;
  if(o.msg){txt(g,o.msg,W/2,H/2,c.ink3,'center',13);return;}
  let [x0,x1]=o.xr;if(x0>x1)[x0,x1]=[x1,x0];if(!(x1>x0))x1=x0+1;
  const N=300,vals=[];
  const S=o.series.map(s=>{const p=[];for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;let y;try{y=s.f(x);}catch(e){y=NaN;}p.push(y);if(isFinite(y))vals.push(y);}return p;});
  let ymin=0,ymax=0;
  if(vals.length){vals.sort((a,b)=>a-b);const q=k=>vals[clamp(Math.floor(k*(vals.length-1)),0,vals.length-1)];ymin=Math.min(0,q(0.01));ymax=Math.max(0,q(0.99));}
  if(!(ymax-ymin>0)){ymax=ymin+1;}const pd=(ymax-ymin)*0.1;if(ymin<0)ymin-=pd;if(ymax>0)ymax+=pd;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);
  g.lineWidth=1;
  for(const v of niceTicks(x0,x1,4)){line(g,X(v),T,X(v),H-B,c.grid,1);txt(g,fmt(v,3),X(v),H-B+13,c.ink3,'center',11);}
  for(const v of niceTicks(ymin,ymax,4)){line(g,L,Y(v),W-R,Y(v),c.grid,1);txt(g,fmt(v,3),L-6,Y(v),c.ink3,'right',11);}
  line(g,L,Y(0),W-R,Y(0),c.ink3,1);line(g,L,T,L,H-B,c.rule,1);
  g.save();g.beginPath();g.rect(L,T,W-L-R,H-T-B);g.clip();
  if(o.gap){const [ia,ib]=o.gap.s,[ga,gb]=o.gap.xr;g.fillStyle=c.ref;g.globalAlpha=0.22;
    for(let i=0;i<N;i++){const xa=x0+(x1-x0)*i/N,xb=x0+(x1-x0)*(i+1)/N;if(xa<Math.min(ga,gb)||xb>Math.max(ga,gb))continue;
      const a1=S[ia][i],a2=S[ia][i+1],b1=S[ib][i],b2=S[ib][i+1];if(![a1,a2,b1,b2].every(isFinite))continue;
      g.beginPath();g.moveTo(X(xa),Y(a1));g.lineTo(X(xb),Y(a2));g.lineTo(X(xb),Y(b2));g.lineTo(X(xa),Y(b1));g.closePath();g.fill();}
    g.globalAlpha=1;}
  if(o.strips){const {f,n,a,b}=o.strips,dx=(b-a)/n;
    for(let i=0;i<n;i++){const xa=a+i*dx,xm=xa+dx/2;let y;try{y=f(xm);}catch(e){y=NaN;}if(!isFinite(y))continue;
      const px=X(Math.min(xa,xa+dx)),pw=Math.abs(X(xa+dx)-X(xa)),py=Math.min(Y(y),Y(0)),ph=Math.abs(Y(y)-Y(0));
      g.globalAlpha=0.16;g.fillStyle=c.acc;g.fillRect(px,py,pw,ph);g.globalAlpha=0.55;g.strokeStyle=c.acc;g.lineWidth=n>30?0.6:1;g.strokeRect(px,py,pw,ph);}
    g.globalAlpha=1;}
  o.series.forEach((s,k)=>{g.strokeStyle=s.col;g.lineWidth=s.w||2.4;g.setLineDash(s.dash||[]);g.beginPath();let on=false;
    for(let i=0;i<=N;i++){const y=S[k][i],x=x0+(x1-x0)*i/N;if(!isFinite(y)||Math.abs(Y(y))>1e5){on=false;continue;}if(on)g.lineTo(X(x),Y(y));else{g.moveTo(X(x),Y(y));on=true;}}
    g.stroke();g.setLineDash([]);});
  (o.tangents||[]).forEach(tg=>{if(!isFinite(tg.y)||!isFinite(tg.m))return;const sp=(x1-x0)*0.2;line(g,X(tg.x-sp),Y(tg.y-tg.m*sp),X(tg.x+sp),Y(tg.y+tg.m*sp),tg.col,2,tg.dash);});
  if(o.probe!=null&&isFinite(o.probe)){line(g,X(o.probe),T,X(o.probe),H-B,c.ink2,1,[4,4]);}
  (o.pts||[]).forEach(p=>{if(!isFinite(p.y))return;g.fillStyle=p.col;g.beginPath();g.arc(X(p.x),Y(p.y),4.5,0,7);g.fill();g.strokeStyle=c.panel;g.lineWidth=1.5;g.stroke();});
  g.restore();
  txt(g,fitT(g,'↑ '+(o.yl||''),W-16),8,12,c.ink,'left',12);txt(g,fitT(g,(o.xl||'')+' →',W-L-R),W-R,H-8,c.ink,'right',12);
  if(o.legend){let x=W-R;for(let i=o.legend.length-1;i>=0;i--){const [lab,col]=o.legend[i];g.font='12px "IBM Plex Sans",sans-serif';const w=g.measureText(lab).width;txt(g,lab,x,30,c.ink2,'right',12);line(g,x-w-22,30,x-w-6,30,col,2.4);x-=w+32;}}}

const SCN={

/* ---------- common-sense prompts ---------- */
function sample(f,a,b,n){const o=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;let y;try{y=f(x);}catch(e){y=NaN;}o.push([x,y]);}return o;}
function shapePrompts(uf,rf,a,b,e,what){const out=[],U=sample(uf,a,b,24),R=sample(rf,a,b,24);
  if(U.some(p=>!isFinite(p[1])))return out;
  const scale=Math.max(...R.map(p=>Math.abs(p[1])))||1;
  let opp=0,cnt=0;R.forEach((p,i)=>{if(Math.abs(p[1])>0.05*scale){cnt++;if(Math.sign(p[1])!==Math.sign(U[i][1]))opp++;}});
  if(cnt&&opp/cnt>0.6){out.push(`Your ${what} has the opposite sign to the real one. Should each piece add to the total or take away from it?`);return out;}
  const rat=[];R.forEach((p,i)=>{if(Math.abs(p[1])>0.05*scale)rat.push(U[i][1]/p[1]);});
  if(rat.length>3){const mean=rat.reduce((s,x)=>s+x,0)/rat.length,spread=Math.max(...rat)-Math.min(...rat);
    if(spread<0.02*Math.abs(mean)&&Math.abs(mean-1)>0.01){out.push(mean>1?`Everywhere, your ${what} comes out about ${fmt(mean,2)} times too big. The pattern from ${e[0]} to ${e[1]} looks right, so one factor is extra or too large.`:`Everywhere, your ${what} comes out about ${fmt(1/mean,2)} times too small. The pattern looks right, so a factor is missing.`);return out;}}
  const span=v=>Math.max(...v.map(p=>p[1]))-Math.min(...v.map(p=>p[1]));
  const um=Math.max(...U.map(p=>Math.abs(p[1])))||1;
  if(span(U)<0.01*um&&span(R)>0.1*scale){out.push(`Your ${what} is the same everywhere, but the real one changes between ${e[0]} and ${e[1]}. Which end should be bigger, and why?`);return out;}
  const du=U[U.length-1][1]-U[0][1],dr=R[R.length-1][1]-R[0][1];
  if(du*dr<0&&Math.abs(dr)>0.1*scale){const ub=du>0?e[1]:e[0],rb=dr>0?e[1]:e[0];out.push(`Your formula makes the ${what} biggest near ${ub}. Picture ${ub} and ${rb}: which one really needs more?`);return out;}
  out.push(`Compare your ${what} near ${e[0]} and near ${e[1]} with what really happens there. The numbers in step 2 can help.`);return out;}
function sensePrompts(m){const t=TPL[cur],r=refOf(t),e=t.ends||['the start','the end'],out=[];
  if(t.kind==='int'){const tol=1e-6*Math.abs(r.hi-r.lo);
    if(Math.abs(m.loV-r.lo)>tol||Math.abs(m.hiV-r.hi)>tol)out.push(`Check your range. Your slices run from ${S(m.v)} = ${fmt(m.loV,3)} to ${S(m.v)} = ${fmt(m.hiV,3)}. Does that cover everything, from ${e[0]} to ${e[1]}?`);
    if(Math.abs((m.preV||0)-r.pre)>1e-6*Math.max(1,Math.abs(r.pre)))out.push(r.pre?'Think about where things stand before the first slice. Does the total start from zero?':'Your start value adds something before any slice is counted. Should the total start from zero here?');
    if(m.fx)shapePrompts(m.fx,r.fx,r.lo,r.hi,e,'slices').forEach(x=>out.push(x));}

/* ---------- checking ---------- */
function derCompare(m){const r=refOf(TPL[cur]);let scale=0;const pts=[];for(let i=0;i<=60;i++){const x=r.dom[0]+(r.dom[1]-r.dom[0])*i/60,y=r.fx(x);scale=Math.max(scale,Math.abs(y));pts.push([x,y]);}
  let worst=0,wx=null,bad=false;for(const [x,y] of pts){let u;try{u=m.fx(x);}catch(e){u=NaN;}if(!isFinite(u)){bad=true;wx=x;break;}const e=Math.abs(u-y)/(Math.abs(y)+1e-3*scale);if(e>worst){worst=e;wx=x;}}

function check(){const t=TPL[cur],st=state(),m=M=buildModel(),r=refOf(t);st.ghost=false;
  if(m.errs.length){fbBad('Fix this first',[`${m.errs[0][0]}: ${m.errs[0][1]}`]);return after();}
  if(t.kind==='int'){
    if(!m.fin.ast){st.fb={k:'info',h:'<p>Build one slice first, in step 2.</p>'};return after();}
    if(m.lo.empty||m.hi.empty){st.fb={k:'info',h:'<p>Fill in where the slices start and end, in step 3.</p>'};return after();}
    if(!m.lin){fbBad('Not yet',['Your slice’s amount doesn’t grow in step with its thickness, so the pieces can’t settle to a total. Step 2 has a note about it.']);return after();}
    if(!isFinite(m.total)){fbBad('Not yet',['Your set-up doesn’t give a finite number yet.']);return after();}
    const rel=(m.total-r.ans)/Math.abs(r.ans),dimOk=m.strip&&eqd(m.strip,t.ans.u)&&(!m.preD||eqd(m.preD,t.ans.u));
    if(Math.abs(rel)<2e-3&&dimOk){
      if(Math.abs(m.preV-r.pre)<=1e-6*Math.max(1,Math.abs(r.pre))){const span=Math.abs(r.hi-r.lo),tol=1e-6*span,same=Math.abs(m.loV-r.lo)<tol&&Math.abs(m.hiV-r.hi)<tol,flip=Math.abs(m.loV-r.hi)<tol&&Math.abs(m.hiV-r.lo)<tol;
        if(same||flip){let worst=0,scale=0;for(let i=0;i<=40;i++){const x=r.lo+(r.hi-r.lo)*i/40,y=r.fx(x);scale=Math.max(scale,Math.abs(y));let u;try{u=m.fx(x);}catch(e){u=NaN;}worst=Math.max(worst,isFinite(u)?Math.abs((flip?-u:u)-y):Infinity);}
          if(worst>2e-3*scale){fbBad('So close',['Your total comes out right, but your slices don’t match the physics at every spot. A pattern drawn backwards, mirrored end to end, adds up to the same total but describes a different situation.'],shapePrompts(x=>flip?-m.fx(x):m.fx(x),r.fx,r.lo,r.hi,t.ends||['the start','the end'],'slices'));return after();}}}
      return win(t,`${t.ans.lhs} = ${fmt(r.ans,4)} ${uName(t.ans.u)}.`);}
    st.ghost=true;
    const lines=[`Your set-up gives ${fmt(m.total,4)}${m.strip?' '+uName(m.strip):''}. The real ${t.ans.name} is shown as a dashed ghost.`];
    if(Math.abs(rel)<2e-3)lines[0]=`The number matches, but the units don’t: a total ${t.ans.name} should be in ${uName(t.ans.u)}.`;
    else if(m.strip&&!eqd(m.strip,t.ans.u))lines.push(`Its units also come out as ${uName(m.strip)} instead of ${uName(t.ans.u)}.`);
    fbBad('Not yet',lines,sensePrompts(m));return after();}
  if(!m.fx){st.fb={k:'info',h:'<p>Build your formula first, in step 2.</p>'};return after();}

  const lines=[];if(cmp.bad)lines.push(`Your formula has no finite value at ${S(t.v)} = ${fmt(cmp.wx,3)}.`);

  if(!cmp.bad&&cmp.worst>=2e-3&&m.dim&&!m.dimErr&&!eqd(m.dim,t.ans.u))lines.push(`Your units also come out as ${uName(m.dim)} instead of ${uName(t.ans.u)}.`);

function sbCalc(){const c=SB[sbCur],s=sbS(),ys=s.pts,n=ys.length,[x0,x1]=c.xr,h=(x1-x0)/(n-1),d=[];
  for(let i=0;i<n-1;i++)d.push((ys[i+1]-ys[i])/h);
  const mk=new Array(n);mk[0]=d[0];mk[n-1]=d[n-2];for(let i=1;i<n-1;i++)mk[i]=d[i-1]*d[i]<=0?0:(d[i-1]+d[i])/2;
  for(let i=0;i<n-1;i++){if(d[i]===0){mk[i]=0;mk[i+1]=0;continue;}const a=mk[i]/d[i],b=mk[i+1]/d[i],q=a*a+b*b;if(q>9){const tau=3/Math.sqrt(q);mk[i]=tau*a*d[i];mk[i+1]=tau*b*d[i];}}
  const seg=x=>{const i=clamp(Math.floor((x-x0)/h),0,n-2);return [i,(x-(x0+i*h))/h];};
  const f=x=>{const [i,t]=seg(x),t2=t*t,t3=t2*t;return (2*t3-3*t2+1)*ys[i]+(t3-2*t2+t)*h*mk[i]+(-2*t3+3*t2)*ys[i+1]+(t3-t2)*h*mk[i+1];};
  const slope=x=>{const [i,t]=seg(x),t2=t*t;return ((6*t2-6*t)*ys[i]+(-6*t2+6*t)*ys[i+1])/h+(3*t2-4*t+1)*mk[i]+(3*t2-2*t)*mk[i+1];};
  const G=600,Fc=[0];let mx=-Infinity,mn=Infinity,smx=-Infinity,smn=Infinity,prev=f(x0);
  for(let k=1;k<=G;k++){const x=x0+(x1-x0)*k/G,y=f(x);Fc.push(Fc[k-1]+(prev+y)/2*(x1-x0)/G);prev=y;}
  for(let k=0;k<=G;k++){const x=x0+(x1-x0)*k/G,y=f(x),sl=slope(x);mx=Math.max(mx,y);mn=Math.min(mn,y);smx=Math.max(smx,sl);smn=Math.min(smn,sl);}
  const F=x=>{const u=clamp((x-x0)/(x1-x0),0,1)*G,k=Math.floor(u);return k>=G?Fc[G]:Fc[k]+(Fc[k+1]-Fc[k])*(u-k);};
  const start=c.start||0;let peak=-Infinity,minV=Infinity;Fc.forEach(v=>{peak=Math.max(peak,start+v);minV=Math.min(minV,start+v);});
  const tx=x0+(x1-x0)*s.tc;
  return {c,s,f,slope,F,Fend:Fc[G],endV:start+Fc[G],peakV:peak,minV,max:mx,min:mn,smax:smx,smin:smn,tx,Ft:F(tx),ft:f(tx),st:slope(tx),Vt:start+F(tx),x0,x1,h,n};}
function sbDrawGraph(k){const cv=$('#sb-graph'),{g,W,H}=prep(cv),cc=colors(),c=k.c,s=k.s,L=58,R=18,T=30,B=36,[y0,y1]=c.yr;
  const X=x=>L+(x-k.x0)/(k.x1-k.x0)*(W-L-R),Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);sbMap={L,R,T,B,W,H,X,Y};

  for(const v of niceTicks(y0,y1,5)){line(g,L,Y(v),W-R,Y(v),cc.grid,1);txt(g,fmt(v,3),L-6,Y(v),cc.ink3,'right',11);}
  line(g,L,Y(0),W-R,Y(0),cc.ink3,1.2);
  if(c.kind==='int'){const N=240,xe=k.tx;for(let i=0;i<N;i++){const xa=k.x0+(xe-k.x0)*i/N,xb=k.x0+(xe-k.x0)*(i+1)/N,ya=k.f(xa),yb=k.f(xb);
      g.fillStyle=(ya+yb)/2>=0?cc.acc:cc.bad;g.globalAlpha=0.24;g.beginPath();g.moveTo(X(xa),Y(0));g.lineTo(X(xa),Y(ya));g.lineTo(X(xb),Y(yb));g.lineTo(X(xb),Y(0));g.closePath();g.fill();}g.globalAlpha=1;}
  g.strokeStyle=cc.acc;g.lineWidth=2.6;g.beginPath();for(let i=0;i<=300;i++){const x=k.x0+(k.x1-k.x0)*i/300;i?g.lineTo(X(x),Y(k.f(x))):g.moveTo(X(x),Y(k.f(x)));}g.stroke();

  s.pts.forEach((p,i)=>{const x=X(k.x0+k.h*i),y=Y(p);g.fillStyle=i===s.sel?cc.acc:cc.panel;g.strokeStyle=cc.acc;g.lineWidth=2.5;g.beginPath();g.arc(x,y,8,0,7);g.fill();g.stroke();});

function sbDraw(){if(mode!=='sb')return;const k=sbCalc(),c=k.c,s=k.s;sbDrawGraph(k);const {g,W,H}=prep($('#sb-scene'));SBS[c.scene](g,W,H,k,colors());

function sbSetPt(i,py){const c=SB[sbCur],s=sbS(),[y0,y1]=c.yr,{T,B,H}=sbMap;let v=y1-(py-T)/(H-T-B)*(y1-y0);v=Math.round(v/c.step)*c.step;v=clamp(v,y0,y1);s.pts[i]=+v.toFixed(4);s.sel=i;schedule();}
function sbStart(){if(sbPlay){sbStop();return;}const c=SB[sbCur],s=sbS();
  if(reduceMotion()){s.tc=1;s.flight=c.scene==='cat'?1:0;$('#sb-t').value=1000;sbDraw();return;}
  sbPlay={t0:performance.now(),dur:c.scene==='cat'?4200:4500};$('#sb-play').textContent='Pause';
  const tick=now=>{if(!sbPlay)return;const p=Math.min(1,(now-sbPlay.t0)/sbPlay.dur),s=sbS();
    if(c.scene==='cat'){if(p<0.45){s.tc=p/0.45;s.flight=0;}else{s.tc=1;s.flight=(p-0.45)/0.55;}}else s.tc=p;
    $('#sb-t').value=Math.round(s.tc*1000);sbDraw();if(p<1)sbPlay.raf=requestAnimationFrame(tick);else sbStop();};
  sbPlay.raf=requestAnimationFrame(tick);}

{const sg=$('#sb-graph');let drag=null;
