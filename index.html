<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Slice &amp; Sum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap">
<style>
/* layout: problem rail on the left, a bench of stacked panels on graph paper to the right */
:root{
  --paper:#EEF2F6; --panel:#FFFFFF; --ink:#152231; --ink-2:#465668; --ink-3:#77869A;
  --grid:#DDE5EE; --rule:#CCD6E2; --accent:#1F5BD0; --accent-soft:#E3ECFC;
  --ref:#B26A04; --ref-soft:#FBEFD9; --good:#17734A; --good-soft:#E1F2E8; --bad:#B23A2C; --bad-soft:#FBE8E5;
  --chip:#E7EDF6; --chip-ink:#1A3561; --field:#FFFFFF; --water:#8DBBE8; --metal:#A7B1BE; --hot:#E2762F;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --f-math:"STIX Two Text","Cambria Math","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D151F; --panel:#142130; --ink:#E2E9F1; --ink-2:#A6B4C4; --ink-3:#74849B;
  --grid:#172433; --rule:#283849; --accent:#6EA4FF; --accent-soft:#1B2E4D;
  --ref:#F2B245; --ref-soft:#3A2C12; --good:#4DC48A; --good-soft:#123323; --bad:#FF7E6E; --bad-soft:#3E1C18;
  --chip:#1D2D43; --chip-ink:#CFE0FF; --field:#0F1A27; --water:#2B5C8F; --metal:#5C6A7B; --hot:#FF9A4D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D151F; --panel:#142130; --ink:#E2E9F1; --ink-2:#A6B4C4; --ink-3:#74849B;
  --grid:#172433; --rule:#283849; --accent:#6EA4FF; --accent-soft:#1B2E4D;
  --ref:#F2B245; --ref-soft:#3A2C12; --good:#4DC48A; --good-soft:#123323; --bad:#FF7E6E; --bad-soft:#3E1C18;
  --chip:#1D2D43; --chip-ink:#CFE0FF; --field:#0F1A27; --water:#2B5C8F; --metal:#5C6A7B; --hot:#FF9A4D; color-scheme:dark}
*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1240px;margin:0 auto}
header.top{padding-block:22px 18px;display:flex;align-items:center;gap:14px}
.logo{font-family:var(--f-math);font-size:44px;line-height:1;color:var(--accent);width:52px;height:52px;display:grid;place-items:center;border:1.5px solid var(--accent);border-radius:10px;background:var(--panel)}
h1{font-family:var(--f-display);font-weight:600;font-size:34px;letter-spacing:.01em;margin:0;line-height:1}
header p{margin:4px 0 0;color:var(--ink-2);font-size:14px}
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
aside{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:14px 12px;position:sticky;top:max(12px,env(safe-area-inset-top,0px))}
@media (max-width:900px){aside{position:static}}
.tier{margin:0 0 12px}
.tier:last-child{margin:0}
.tier h4{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 4px 6px}
.plist{display:grid;gap:2px}
@media (max-width:900px){.plist{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}}
.pbtn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;font-size:14px;color:var(--ink);width:100%}
.pbtn:hover{background:var(--chip)}
.pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pbtn[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:500}
.pbtn .k{font-family:var(--f-math);font-style:italic;width:16px;text-align:center;color:var(--ink-3);flex:none}
.pbtn .ok{margin-left:auto;color:var(--good);font-size:13px;flex:none}
main{display:grid;gap:16px;min-width:0}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:18px 20px;min-width:0}
@media (max-width:520px){.card{padding:14px 14px}}
.phead{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.tags{display:flex;gap:6px;margin-bottom:6px}
.tag{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--chip-ink)}
.tag.int{background:var(--accent-soft);color:var(--accent)}
.tag.der{background:var(--ref-soft);color:var(--ref)}
h2{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.ptext{max-width:68ch;margin:10px 0 16px;font-size:16px}
.mv{font-family:var(--f-math);font-style:italic;font-size:1.08em}
.mn{font-family:var(--f-math);font-size:1.08em}
sub{font-size:.72em}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
table.kv{border-collapse:collapse;width:100%;font-size:14px}
table.kv td{padding:5px 8px 5px 0;border-top:1px solid var(--rule);vertical-align:top}
table.kv tr:first-child td{border-top:0}
table.kv td.s{width:56px;white-space:nowrap}
table.kv td.v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13px}
table.kv td.d{color:var(--ink-2)}
ul.phys{margin:0 0 14px;padding:0;list-style:none;display:grid;gap:6px;font-size:14px}
ul.phys li{padding-left:14px;position:relative}
ul.phys li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:1.5px;background:var(--ink-3)}
button{font:inherit}
.btn{cursor:pointer;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:8px;font-size:14px;font-weight:500}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.link{border:0;padding:4px 0;background:none;color:var(--accent);font-weight:500}
.palette{display:grid;gap:10px;margin-bottom:6px}
.pgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pgroup .gl{font-size:12px;color:var(--ink-3);width:92px;flex:none}
@media (max-width:520px){.pgroup .gl{width:100%}}
.chip{cursor:grab;border:1px solid transparent;background:var(--chip);color:var(--chip-ink);border-radius:7px;padding:4px 10px;min-width:36px;font-size:15px;line-height:1.3;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip:active{cursor:grabbing}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chip.var{background:var(--accent-soft);color:var(--accent)}
.chip.fn{font-family:var(--f-math)}
.help{font-size:13px;color:var(--ink-2);margin:8px 0 16px;max-width:75ch}
.help code{font-family:var(--f-mono);font-size:12.5px;background:var(--chip);padding:1px 5px;border-radius:4px}
.eqrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px;border:1px dashed var(--rule);border-radius:10px;background:var(--paper)}
.lhs{font-family:var(--f-math);font-size:22px;white-space:nowrap}
.intsign{font-family:var(--f-math);font-size:52px;line-height:.9;margin:0 -2px 0 2px}
.lims{display:flex;flex-direction:column;gap:6px}
input.fx,input.lim,input.var{font-family:var(--f-mono);font-size:15px;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:7px;padding:7px 9px;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input.lim{width:110px;font-size:13.5px;padding:5px 8px}
input.var{width:52px;text-align:center}
input.fx.grow{flex:1 1 260px}
input.fx.pre{width:150px}
.dee{font-family:var(--f-math);font-size:22px;font-style:italic}
.plus{font-family:var(--f-math);font-size:22px}
.preview{margin-top:12px;min-height:48px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--f-math);font-size:21px;overflow-x:auto}
.preview .pl{font-family:var(--f-body);font-size:12px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.slot{display:inline-block;min-width:18px;height:22px;border:1.5px dashed var(--ink-3);border-radius:4px;vertical-align:middle}
.slot.bad{border-color:var(--bad)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 2px;font-size:.92em}
.frac>span:first-child{padding:0 3px 1px}
.frac>span:last-child{border-top:1.2px solid currentColor;padding:1px 3px 0}
.sq{border-top:1.2px solid currentColor;padding-left:1px}
.ilim{display:inline-flex;flex-direction:column;vertical-align:middle;font-size:.6em;line-height:1.15;margin-right:3px}
.isig{font-size:1.5em;vertical-align:middle}
.perr{font-size:13.5px;color:var(--bad);margin-top:6px;display:grid;gap:2px}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.vgrid figure{margin:0;min-width:0}
.vgrid figure.wide{grid-column:1/-1}
canvas{display:block;width:100%;height:260px;border:1px solid var(--rule);border-radius:9px;background:var(--panel)}
figcaption{font-size:13px;color:var(--ink-2);margin-top:6px;min-height:2.6em}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px 24px;margin-top:12px}
.sl{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.sl input{flex:1;accent-color:var(--accent);min-width:0}
.sl output{font-family:var(--f-mono);font-size:13px;min-width:28px;text-align:right;color:var(--ink)}
.readout{margin-top:10px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.readout b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:15px;display:grid;gap:8px}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--chip);color:var(--chip-ink)}
.fb .row{display:flex;gap:8px;flex-wrap:wrap}
.fb p{margin:0;color:var(--ink)}
.hints{margin-top:14px;display:grid;gap:10px}
.hint{border-left:3px solid var(--ref);background:var(--ref-soft);padding:10px 14px;border-radius:0;font-size:14.5px}
.hint .hl{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--ref);margin-bottom:2px}
.hint p{margin:0}
.sol{border:1px solid var(--rule);border-radius:9px;padding:12px 14px;display:grid;gap:10px}
.sol .preview{margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="logo" aria-hidden="true">∫</div>
    <div><h1>Slice &amp; Sum</h1><p>Build integrals and derivatives straight from the physics, and see what you built.</p></div>
  </header>
  <div class="layout">
    <aside id="list" aria-label="Problems"></aside>
    <main>
      <section class="card" id="prob">
        <div class="phead">
          <div><div class="tags"><span class="tag" id="p-tier"></span><span class="tag" id="p-kind"></span></div><h2 id="p-title"></h2></div>
          <button class="btn" id="b-new" type="button">New numbers</button>
        </div>
        <p class="ptext" id="p-text"></p>
        <div class="cols">
          <div><h3>Given</h3><table class="kv" id="p-given"></table></div>
          <div><h3>Physics you can use</h3><ul class="phys" id="p-phys"></ul><h3 id="p-vars-h">Coordinates</h3><table class="kv" id="p-vars"></table></div>
        </div>
      </section>

      <section class="card" id="build">
        <h3>Blocks</h3>
        <div class="palette" id="palette"></div>
        <p class="help" id="help"></p>
        <div class="eqrow" id="eq"></div>
        <button class="btn link" id="b-pre" type="button">+ Add a term outside the integral</button>
        <div class="preview" id="preview"></div>
        <div class="perr" id="perr"></div>
      </section>

      <section class="card" id="viz">
        <div class="vgrid">
          <figure id="fig-s"><canvas id="cv-s" aria-label="Physical picture of the problem"></canvas><figcaption id="cap-s"></figcaption></figure>
          <figure id="fig-a"><canvas id="cv-a" aria-label="Graph"></canvas><figcaption id="cap-a"></figcaption></figure>
          <figure id="fig-b" class="wide"><canvas id="cv-b" aria-label="Graph of your expression"></canvas><figcaption id="cap-b"></figcaption></figure>
        </div>
        <div class="sliders">
          <label class="sl"><span id="sl-p-l">Move the slice</span><input type="range" id="sl-p" min="0" max="1000" step="1" value="500"></label>
          <label class="sl" id="sl-n-w"><span>Strips</span><input type="range" id="sl-n" min="1" max="60" step="1" value="12"><output id="sl-n-o">12</output></label>
        </div>
        <div class="readout" id="readout"></div>
      </section>

      <section class="card" id="act">
        <div class="actions">
          <button class="btn primary" id="b-check" type="button">Check</button>
          <button class="btn" id="b-hint" type="button">Get a hint (1 of 3)</button>
          <button class="btn" id="b-sol" type="button" hidden>Show a solution</button>
        </div>
        <div id="fb"></div>
        <div class="hints" id="hints"></div>
      </section>
    </main>
  </div>
</div>

<script id="core">
/* ---------- units ---------- */
const U={none:[0,0,0],m:[1,0,0],kg:[0,1,0],s:[0,0,1],J:[2,1,-2],N:[1,1,-2],W:[2,1,-3],mps:[1,0,-1],mps2:[1,0,-2],mps3:[1,0,-3],
  kgpm:[-1,1,0],rho:[-3,1,0],Pa:[-1,1,-2],m3ps:[3,0,-1],kgps:[0,1,-1],Npm:[0,1,-2],Npm3:[-2,1,-2],G:[3,-1,-2],ps:[0,0,-1],kgm2:[2,1,0]};
const UN=[[U.none,'no units'],[U.m,'m'],[U.kg,'kg'],[U.s,'s'],[U.J,'J'],[U.N,'N'],[U.W,'W'],[U.mps,'m/s'],[U.mps2,'m/s²'],[U.mps3,'m/s³'],
  [U.kgpm,'kg/m'],[U.rho,'kg/m³'],[U.Pa,'Pa'],[U.m3ps,'m³/s'],[U.kgps,'kg/s'],[U.Npm,'N/m'],[U.Npm3,'N/m³'],[U.G,'N·m²/kg²'],[U.ps,'rad/s'],[U.kgm2,'kg·m²'],
  [[2,0,0],'m²'],[[3,0,0],'m³'],[[0,0,-2],'1/s²'],[[-1,0,0],'1/m'],[[2,1,-1],'J·s'],[[1,1,-1],'kg·m/s'],[[-2,1,0],'kg/m²'],[[1,1,0],'kg·m'],[[3,1,-2],'J·m'],[[1,0,1],'m·s'],[[2,0,-1],'m²/s'],[[2,0,-2],'m²/s²'],[[0,1,-2],'N/m']];
const eqd=(a,b)=>a.every((v,i)=>Math.abs(v-b[i])<1e-9);
const addd=(a,b)=>a.map((v,i)=>v+b[i]), subd=(a,b)=>a.map((v,i)=>v-b[i]), zerod=a=>a.every(v=>Math.abs(v)<1e-9);
const SUP='⁻⁰¹²³⁴⁵⁶⁷⁸⁹';
function supS(n){return String(n).replace(/[-0-9]/g,ch=>SUP['-0123456789'.indexOf(ch)]);}
function uName(d){for(const [k,n] of UN) if(eqd(k,d)) return n;
  const nm=['m','kg','s'],parts=[];d.forEach((p,i)=>{if(Math.abs(p)>1e-9){const r=Math.round(p*100)/100;parts.push(nm[i]+(r===1?'':(Number.isInteger(r)?supS(r):'^'+r)));}});return parts.join('·')||'no units';}

/* ---------- numbers ---------- */
function trimZ(s){return (s.includes('.')&&!s.includes('e'))?s.replace(/\.?0+$/,''):s;}
function fmt(x,sig=4){if(x==null||!isFinite(x))return '—';if(x===0)return '0';const a=Math.abs(x);
  if(a>=1e-3&&a<1e4){const s=x.toPrecision(sig);if(!s.includes('e'))return trimZ(s);}
  if(a>=1e4&&a<1e6)return Math.round(x).toLocaleString('en-US');
  let e=Math.floor(Math.log10(a)),ms=trimZ((x/Math.pow(10,e)).toPrecision(sig));
  if(Math.abs(parseFloat(ms))>=10){e++;ms=trimZ((x/Math.pow(10,e)).toPrecision(sig));}
  return ms+'×10'+supS(e);}
function fmtLit(v){return (Number.isInteger(v)&&Math.abs(v)<1e6)?String(v):fmt(v,6);}

/* ---------- expression parser ---------- */
const FUNCS={sin:Math.sin,cos:Math.cos,tan:Math.tan,exp:Math.exp,ln:Math.log,log:Math.log,sqrt:Math.sqrt,atan:Math.atan,asin:Math.asin,acos:Math.acos,abs:Math.abs};
const ALIAS={pi:'π',rho:'ρ',lambda:'λ',beta:'β',alpha:'α',omega:'ω',theta:'θ',sigma:'σ',mu:'μ'};
function PErr(msg){const e=new Error(msg);e.user=true;return e;}
function tokenize(s){
  s=s.replace(/[−–—]/g,'-').replace(/[×·⋅∙*]/g,'*').replace(/÷/g,'/').replace(/²/g,'^2').replace(/³/g,'^3');
  const out=[];let i=0;
  while(i<s.length){const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
      if(s[j]==='e'||s[j]==='E'){let k=j+1;if(s[k]==='+'||s[k]==='-')k++;if(/[0-9]/.test(s[k]||'')){j=k;while(j<s.length&&/[0-9]/.test(s[j]))j++;}}
      const str=s.slice(i,j),v=Number(str);if(!isFinite(v)||str==='.')throw PErr(`“${str}” isn’t a number I can read.`);
      out.push({t:'num',v});i=j;continue;}
    if(/[\p{L}_]/u.test(c)){let j=i+1;while(j<s.length&&/[\p{L}\p{N}_]/u.test(s[j])&&s[j]!=='π')j++;if(c==='π')j=i+1;out.push({t:'id',v:s.slice(i,j)});i=j;continue;}
    if('+-*/^(),'.includes(c)){out.push({t:'op',v:c});i++;continue;}
    if(c==='√'){out.push({t:'sqrt'});i++;continue;}
    if(c==='∫'){out.push({t:'id',v:'int'});i++;continue;}
    throw PErr(`“${c}” isn’t something I can use here.`);}
  return out;}
function splitId(id,K){
  if(K.has(id)||FUNCS[id]||id==='int')return [id];
  const am=id.match(/^(pi|rho|lambda|beta|alpha|omega|theta|sigma|mu)(\d*)$/);
  if(am&&K.has(ALIAS[am[1]]+am[2]))return [ALIAS[am[1]]+am[2]];
  const res=[];let i=0;
  while(i<id.length){let found=null;
    for(let j=id.length;j>i;j--){const sub=id.slice(i,j);
      if(K.has(sub)||FUNCS[sub]){found=[sub,j];break;}
      if(ALIAS[sub]&&K.has(ALIAS[sub])){found=[ALIAS[sub],j];break;}}
    if(!found){if(/[0-9]/.test(id[i])){let j=i;while(j<id.length&&/[0-9]/.test(id[j]))j++;res.push({num:+id.slice(i,j)});i=j;continue;}
      throw PErr(`I don’t know the symbol “${id.slice(i)}”. Use the blocks, or separate symbols with spaces.`);}
    res.push(found[0]);i=found[1];}
  return res;}
function parse(src,K){
  const raw=tokenize(src),T=[];
  for(const tk of raw){if(tk.t==='id'){for(const it of splitId(tk.v,K))T.push(typeof it==='string'?{t:'id',v:it}:{t:'num',v:it.num});}else T.push(tk);}
  if(!T.length)return null;
  let p=0;const peek=()=>T[p],next=()=>T[p++];
  const isOp=v=>peek()&&peek().t==='op'&&peek().v===v;
  const need=(v,msg)=>{if(!isOp(v))throw PErr(msg);next();};
  const startsPrimary=()=>{const k=peek();return !!k&&(k.t==='num'||k.t==='id'||k.t==='sqrt'||(k.t==='op'&&k.v==='('));};
  function expr(){let a=term();while(isOp('+')||isOp('-')){const o=next().v;a={t:'bin',op:o,a,b:term()};}return a;}
  function term(){let a=unary();for(;;){if(isOp('*')||isOp('/')){const o=next().v;a={t:'bin',op:o,a,b:unary()};}else if(startsPrimary()){a={t:'bin',op:'*',a,b:power(),imp:true};}else break;}return a;}
  function unary(){if(isOp('-')){next();return {t:'neg',a:unary()};}if(isOp('+')){next();return unary();}return power();}
  function power(){const b=primary();if(isOp('^')){next();return {t:'bin',op:'^',a:b,b:unary()};}return b;}
  function primary(){const k=next();
    if(!k)throw PErr('The expression stops too early: something is missing at the end.');
    if(k.t==='num')return {t:'num',v:k.v};
    if(k.t==='sqrt')return {t:'fn',n:'sqrt',a:primary()};
    if(k.t==='op'&&k.v==='('){const e=expr();need(')','A “(” is never closed.');return e;}
    if(k.t==='id'){
      if(k.v==='int'){need('(','Write a nested integral as ∫(integrand, variable, from, to).');const f=expr();need(',','Nested integral: put a comma after the integrand, then the variable.');
        const vk=next();if(!vk||vk.t!=='id'||!K.has(vk.v))throw PErr('Nested integral: the second part must be a coordinate, like s.');
        need(',','Nested integral: put a comma after the variable, then the lower limit.');const lo=expr();need(',','Nested integral: put a comma after the lower limit, then the upper limit.');const hi=expr();
        need(')','Nested integral: close it with “)”.');return {t:'int',f,v:vk.v,lo,hi};}
      if(FUNCS[k.v]){need('(',`${k.v} needs brackets, like ${k.v}(x).`);const a=expr();need(')',`The bracket after ${k.v} is never closed.`);return {t:'fn',n:k.v,a};}
      return {t:'sym',n:k.v};}
    if(k.t==='op'&&k.v===')')throw PErr('There’s a “)” with nothing to close.');
    if(k.t==='op'&&k.v===',')throw PErr('Commas only belong inside a nested ∫( , , , ).');
    throw PErr(`“${k.v}” needs something on its left.`);}
  const ast=expr();
  if(p<T.length){const k=T[p];throw PErr(k.v===')'?'There’s an extra “)”.':`I can’t place “${k.v}” here.`);}
  return ast;}
function simpson(f,a,b,n){if(a===b)return 0;if(n%2)n++;const h=(b-a)/n;let s=f(a)+f(b);for(let i=1;i<n;i++)s+=(i%2?4:2)*f(a+i*h);return s*h/3;}
function ev(n,env){switch(n.t){
  case 'num':return n.v;
  case 'sym':{const v=env[n.n];if(v===undefined)throw PErr(`“${n.n}” has no value here.`);return v;}
  case 'neg':return -ev(n.a,env);
  case 'bin':{const a=ev(n.a,env),b=ev(n.b,env);switch(n.op){case '+':return a+b;case '-':return a-b;case '*':return a*b;case '/':return a/b;default:return Math.pow(a,b);}}
  case 'fn':return FUNCS[n.n](ev(n.a,env));
  case 'int':{const lo=ev(n.lo,env),hi=ev(n.hi,env);return simpson(x=>{const e=Object.create(env);e[n.v]=x;return ev(n.f,e);},lo,hi,48);}}}
function hasSym(n,names){if(!n)return false;switch(n.t){case 'sym':return names.includes(n.n);case 'num':return false;case 'neg':return hasSym(n.a,names);case 'bin':return hasSym(n.a,names)||hasSym(n.b,names);case 'fn':return hasSym(n.a,names);case 'int':return hasSym(n.lo,names)||hasSym(n.hi,names)||(!names.includes(n.v)&&hasSym(n.f,names))||(hasSym(n.f,names.filter(x=>x!==n.v)));}return false;}
function DErr(msg){const e=new Error(msg);e.user=true;e.dim=true;return e;}
function dimOf(n,D){switch(n.t){
  case 'num':return {d:[0,0,0],c:n.v};
  case 'sym':return {d:D[n.n]||[0,0,0],c:n.n==='π'?Math.PI:null};
  case 'neg':{const r=dimOf(n.a,D);return {d:r.d,c:r.c==null?null:-r.c};}
  case 'bin':{const A=dimOf(n.a,D),B=dimOf(n.b,D),both=A.c!=null&&B.c!=null;
    if(n.op==='+'||n.op==='-'){
      if(A.c===0)return B; if(B.c===0)return A;
      if(!eqd(A.d,B.d))throw DErr(`you’re ${n.op==='+'?'adding':'subtracting'} ${uName(B.d)} ${n.op==='+'?'to':'from'} ${uName(A.d)}, which can’t be combined`);
      return {d:A.d,c:both?(n.op==='+'?A.c+B.c:A.c-B.c):null};}
    if(n.op==='*')return {d:addd(A.d,B.d),c:both?A.c*B.c:null};
    if(n.op==='/')return {d:subd(A.d,B.d),c:both?A.c/B.c:null};
    if(!zerod(B.d))throw DErr('an exponent has units, but exponents must be plain numbers');
    if(zerod(A.d))return {d:[0,0,0],c:both?Math.pow(A.c,B.c):null};
    if(B.c==null)throw DErr('a quantity with units is raised to a power that isn’t a fixed number');
    return {d:A.d.map(x=>x*B.c),c:null};}
  case 'fn':{const A=dimOf(n.a,D);
    if(n.n==='sqrt')return {d:A.d.map(x=>x/2),c:A.c!=null?Math.sqrt(A.c):null};
    if(n.n==='abs')return A;
    if(!zerod(A.d))throw DErr(`${n.n}( ) has ${uName(A.d)} inside it, but it needs a plain number`);
    return {d:[0,0,0],c:null};}
  case 'int':{const F=dimOf(n.f,D);return {d:addd(F.d,D[n.v]||[0,0,0]),c:null};}}}

/* ---------- display ---------- */
function symHTML(n){if(n==='π')return '<span class="mn">π</span>';const m=n.match(/^(.+?)(\d+|max)$/);
  if(m)return `<i class="mv">${m[1]}</i><sub>${m[2]}</sub>`;return `<i class="mv">${n}</i>`;}
const S=symHTML;
function pp(n,parent=0){let s,pr;
  switch(n.t){
    case 'num':s=fmtLit(n.v);pr=5;break;
    case 'sym':s=symHTML(n.n);pr=5;break;
    case 'neg':s='−'+pp(n.a,3);pr=3;break;
    case 'bin':
      if(n.op==='+'||n.op==='-'){s=pp(n.a,1)+(n.op==='+'?' + ':' − ')+pp(n.b,1.5);pr=1;}
      else if(n.op==='*'){const sep=(n.a.t==='num'&&(n.b.t==='num'||(n.b.t==='bin'&&n.b.op==='^'&&n.b.a.t==='num')))?'·':' ';s=pp(n.a,2)+sep+pp(n.b,2.5);pr=2;}
      else if(n.op==='/'){s=`<span class="frac"><span>${pp(n.a,0)}</span><span>${pp(n.b,0)}</span></span>`;pr=4.2;}
      else{s=pp(n.a,4.5)+'<sup>'+pp(n.b,0)+'</sup>';pr=4;}
      break;
    case 'fn':s=n.n==='sqrt'?`√<span class="sq">${pp(n.a,0)}</span>`:`${n.n}(${pp(n.a,0)})`;pr=5;break;
    case 'int':s=`<span class="isig">∫</span><span class="ilim"><span>${pp(n.hi,0)}</span><span>${pp(n.lo,0)}</span></span>${pp(n.f,1.5)} <i class="mv">d</i>${symHTML(n.v)}`;pr=1.2;break;}
  return pr<parent?`(${s})`:s;}

/* ---------- random ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mkR(seed){const rnd=mulberry(seed);return (a,b,st)=>{const k=Math.round((b-a)/st),v=a+st*Math.floor(rnd()*(k+1)),d=Math.max(0,-Math.floor(Math.log10(st)+1e-9));return +v.toFixed(d+1);};}

 text:`A uniform solid disc with mass ${S('M')} and radius ${S('R')} spins about its centre. Build its moment of inertia ${S('I')} by adding up thin rings.`,
 phys:[`A thin ring of mass <i class="mv">dm</i> at radius ${S('r')}: <i class="mv">dI</i> = ${S('r')}²·<i class="mv">dm</i>`,`Mass per area of a uniform disc: ${S('σ')} = mass ÷ area`,`Area of a circle: ${S('A')} = π${S('r')}²`,`A thin ring’s area is about its circumference × its width`],
 ans:{lhs:S('I'),u:U.kgm2,f:P=>P.M*P.R*P.R/2},
 sol:{f:'r^2 M/(π R^2) 2 π r',v:'r',lo:'0',hi:'R'},
 hint:`A ring at radius ${S('r')} with width <i class="mv">dr</i> has area 2π${S('r')}·<i class="mv">dr</i>. Its mass is ${S('σ')} times that area, with ${S('σ')} = ${S('M')}/(π${S('R')}²). Multiply the ring’s mass by ${S('r')}² and add rings from the centre to the edge.`},

{id:'lj',tier:'Physics',kind:'der',title:'Force between two atoms',scene:'atoms',
 params:r=>({U0:+(r(1,3,0.1)*1e-21).toPrecision(3),a:+(r(0.3,0.4,0.01)*1e-9).toPrecision(3)}),
 sym:[['U0',U.J,'depth of the energy well'],['a',U.m,'separation with the lowest energy'],['m',U.kg,'mass of one atom',6.63e-26]],
 vars:[['x',U.m,'distance between the atoms']],v:'x',dom:P=>[0.92*P.a,2.2*P.a],
 text:`Two atoms interact through the Lennard-Jones potential ${S('U')}(${S('x')}) = ${S('U0')}·((${S('a')}/${S('x')})¹² − 2(${S('a')}/${S('x')})⁶), where ${S('x')} is the distance between them. The force is ${S('F')} = −<i class="mv">dU</i>/<i class="mv">dx</i>, positive when they push apart. Build ${S('F')}(${S('x')}).`,
 phys:[`Force from potential energy: ${S('F')} = −<i class="mv">dU</i>/<i class="mv">dx</i>`,`Power rule: <i class="mv">d</i>/<i class="mv">dx</i> (${S('x')}<sup>${S('n')}</sup>) = ${S('n')}·${S('x')}<sup>${S('n')}−1</sup>`,`(${S('a')}/${S('x')})<sup>${S('n')}</sup> = ${S('a')}<sup>${S('n')}</sup>·${S('x')}<sup>−${S('n')}</sup>`],
 ans:{lhs:`${S('F')}(${S('x')})`,u:U.N},
 sol:{f:'12 U0 / x ((a/x)^12 - (a/x)^6)'},given:{lhs:`${S('U')}(${S('x')})`,f:'U0 ((a/x)^12 - 2 (a/x)^6)',u:U.J,sign:-1},
 hint:`Rewrite each (${S('a')}/${S('x')})<sup>${S('n')}</sup> as ${S('a')}<sup>${S('n')}</sup>${S('x')}<sup>−${S('n')}</sup> so the power rule applies. Differentiate both terms, then flip the sign to get ${S('F')}.`},

{id:'rocket',tier:'Extreme',kind:'int',title:'Interceptor burn',scene:'rocket',
 params:r=>{const m0=r(800,2000,100),q=r(2,8,0.5);return {u:r(2000,3500,100),m0,q,T:Math.round(r(0.4,0.7,0.05)*m0/q)};},
 sym:[['u',U.mps,'exhaust speed'],['q',U.kgps,'fuel burned per second'],['m0',U.kg,'starting mass'],['T',U.s,'burn time'],['g',U.mps2,'gravity on Earth (not out here)',g0]],
 vars:[['t',U.s,'time since ignition'],['s',U.s,'a second time variable, for an integral inside an integral'],['x',U.m,'distance travelled']],
 text:`Your interceptor starts at rest in deep space, far from any gravity. Its engine burns fuel at ${S('q')} kilograms per second with exhaust speed ${S('u')}. As the craft gets lighter it accelerates harder: ${S('a')}(${S('t')}) = ${S('u')}${S('q')}/(${S('m0')} − ${S('q')}${S('t')}). How far has it travelled when the engine cuts off at ${S('t')} = ${S('T')}? That distance decides where it can meet the asteroid.`,
 phys:[`${S('a')} = <i class="mv">dv</i>/<i class="mv">dt</i> and ${S('v')} = <i class="mv">dx</i>/<i class="mv">dt</i>`,`Starting from rest, velocity is the accumulated acceleration`,`<span class="mn">∫</span> 1/(${S('c')} − ${S('q')}${S('s')}) <i class="mv">ds</i> = −(1/${S('q')})·ln(${S('c')} − ${S('q')}${S('s')})`],
 ans:{lhs:`${S('x')}(${S('T')})`,u:U.m,f:P=>{const m1=P.m0-P.q*P.T;return P.u*(P.T-(m1/P.q)*Math.log(P.m0/m1));}},
 sol:{f:'u ln(m0/(m0 - q t))',v:'t',lo:'0',hi:'T'},
 hint:`It takes two steps. Velocity is the sum of ${S('a')}(${S('s')})·<i class="mv">ds</i> from 0 to ${S('t')}. Position is the sum of ${S('v')}(${S('t')})·<i class="mv">dt</i> from 0 to ${S('T')}. Either integrate ${S('a')} by hand first, or put one ∫ inside the other with the nested ∫ block.`},

{id:'track',tier:'Extreme',kind:'int',title:'Predicting the asteroid',scene:'track',
 params:r=>({x0:r(20,80,5)*1000,v0:r(5,20,1),'α':r(0.01,0.05,0.005),'ω':Math.round(2*Math.PI/r(200,600,50)*1e5)/1e5,T:r(600,1800,100)}),
 sym:[['x0',U.m,'distance when first tracked'],['v0',U.mps,'speed away from you when first tracked'],['α',U.mps2,'strength of the periodic push'],['ω',U.ps,'angular frequency of the push'],['T',U.s,'how far ahead to predict'],['m',U.kg,'mass of the asteroid',2e9]],
 vars:[['t',U.s,'time since first tracked'],['s',U.s,'a second time variable, for an integral inside an integral']],
 text:`Radar puts an asteroid at distance ${S('x0')} along your tracking line, moving away at ${S('v0')}. Sunlight heating its surface adds a small periodic push, ${S('a')}(${S('t')}) = ${S('α')}·sin(${S('ω')}${S('t')}). Predict where it will be at time ${S('T')}, so the interceptor can be aimed there.`,
 phys:[`Position = starting position + distance covered since`,`Velocity = starting velocity + accumulated acceleration`,`<span class="mn">∫</span> sin(${S('ω')}${S('s')}) <i class="mv">ds</i> = −cos(${S('ω')}${S('s')})/${S('ω')}`],
 ans:{lhs:`${S('x')}(${S('T')})`,u:U.m,f:P=>P.x0+P.v0*P.T+P['α']/P['ω']*(P.T-Math.sin(P['ω']*P.T)/P['ω'])},
 sol:{pre:'x0',f:'v0 + α (1 - cos(ω t))/ω',v:'t',lo:'0',hi:'T'},
 hint:`Start from the known position ${S('x0')} and add the distance covered. The velocity at time ${S('t')} is ${S('v0')} plus the integral of ${S('a')}(${S('s')}) from 0 to ${S('t')}. That velocity goes inside an integral from 0 to ${S('T')}, and ${S('x0')} goes in a term outside the integral.`},

{id:'los',tier:'Extreme',kind:'der',title:'Line-of-sight rate',scene:'los',
 params:r=>({D:r(5,50,1)*1000,u:r(2,15,0.5)*1000}),
 sym:[['D',U.m,'closest distance of the path'],['u',U.mps,'speed of the asteroid'],['c',U.mps,'speed of light (radar)',2.998e8]],
 vars:[['t',U.s,'time from closest approach']],v:'t',dom:P=>[-3*P.D/P.u,3*P.D/P.u],
 text:`A tracking station watches an asteroid fly past on a straight path. The path comes no closer than ${S('D')}, the asteroid moves at speed ${S('u')}, and closest approach happens at ${S('t')} = 0. The line-of-sight angle is ${S('θ')}(${S('t')}) = atan(${S('u')}${S('t')}/${S('D')}). Proportional navigation steers an interceptor by how fast this angle turns. Build <i class="mv">dθ</i>/<i class="mv">dt</i>.`,
 phys:[`Chain rule: <i class="mv">d</i>/<i class="mv">dt</i> ${S('f')}(${S('z')}(${S('t')})) = ${S('f')}′(${S('z')})·${S('z')}′(${S('t')})`,`<i class="mv">d</i>/<i class="mv">dz</i> atan(${S('z')}) = 1/(1 + ${S('z')}²)`],
 ans:{lhs:'<i class="mv">dθ</i>/<i class="mv">dt</i>',u:U.ps},
 sol:{f:'(u/D) / (1 + (u t/D)^2)'},given:{lhs:`${S('θ')}(${S('t')})`,f:'atan(u t / D)',u:U.none,sign:1},
 hint:`Let ${S('z')} = ${S('u')}${S('t')}/${S('D')}. Then ${S('θ')} = atan(${S('z')}), so <i class="mv">dθ</i>/<i class="mv">dt</i> = (<i class="mv">dθ</i>/<i class="mv">dz</i>)·(<i class="mv">dz</i>/<i class="mv">dt</i>).`},
];
const TIERS=['Basics','Practical','Physics','Extreme'];

function knownOf(t){return new Set(['π',...t.sym.map(s=>s[0]),...t.vars.map(v=>v[0])]);}
function dimsOf(t){const d={'π':U.none};for(const s of t.sym)d[s[0]]=s[1];for(const v of t.vars)d[v[0]]=v[1];return d;}
function mkParams(t,seed){const raw=t.params(mkR(seed)),P={'π':Math.PI};for(const s of t.sym)P[s[0]]=s[3]!==undefined?s[3]:raw[s[0]];return P;}
function envOf(t,P){const e={'π':Math.PI};for(const s of t.sym)e[s[0]]=P[s[0]];return e;}
function fnOf(ast,env,v){return x=>{const e=Object.create(env);e[v]=x;return ev(ast,e);};}
</script>

<script id="ui">
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
let cur=0,P=null,probe=0.5,nStrips=12,lastField=null,M=null,raf=0;
const ST={};
let solved=new Set();
try{solved=new Set(JSON.parse(localStorage.getItem('slicesum.solved')||'[]'));}catch(e){}
function saveSolved(){try{localStorage.setItem('slicesum.solved',JSON.stringify([...solved]));}catch(e){}}
function state(){const t=TPL[cur];return ST[t.id]||(ST[t.id]={f:'',lo:'',hi:'',v:'',pre:'',showPre:false,hint:0,seed:1+Math.floor(Math.random()*1e9),fb:null,showSol:false});}
function tp(str,K){if(!str||!str.trim())return {empty:true};try{const ast=parse(str,K);return ast?{ast}:{empty:true};}catch(e){return {err:e.user?e.message:'That can’t be read as math yet.'};}}

/* ---------- colours ---------- */
function colors(){const cs=getComputedStyle(document.documentElement),g=k=>cs.getPropertyValue(k).trim();
  return {ink:g('--ink'),ink2:g('--ink-2'),ink3:g('--ink-3'),rule:g('--rule'),grid:g('--grid'),acc:g('--accent'),ref:g('--ref'),panel:g('--panel'),
    water:g('--water'),metal:g('--metal'),hot:g('--hot'),good:g('--good'),bad:g('--bad'),paper:g('--paper')};}

/* ---------- reference model ---------- */
const REF={};
function refOf(t){const key=t.id+':'+JSON.stringify(P);if(REF[t.id]&&REF[t.id].key===key)return REF[t.id];
  const K=knownOf(t),E=envOf(t,P),r={key};
  if(t.kind==='int'){r.v=t.sol.v;r.fx=fnOf(parse(t.sol.f,K),E,t.sol.v);r.lo=ev(parse(t.sol.lo,K),E);r.hi=ev(parse(t.sol.hi,K),E);r.ans=t.ans.f(P);}
  else{r.v=t.v;r.fx=fnOf(parse(t.sol.f,K),E,t.v);r.dom=t.dom(P);if(t.given)r.gx=fnOf(parse(t.given.f,K),E,t.v);}
  REF[t.id]=r;return r;}

/* ---------- user model ---------- */
function buildModel(){const t=TPL[cur],st=state(),K=knownOf(t),E=envOf(t,P),D=dimsOf(t),vNames=t.vars.map(v=>v[0]);
  const m={kind:t.kind,errs:[]};
  m.f=tp(st.f,K);
  if(m.f.err)m.errs.push(['Integrand',m.f.err]);
  if(t.kind==='der'){m.f.label='Expression';if(m.f.err)m.errs[0][0]='Expression';
    m.v=t.v;
    if(m.f.ast){const others=vNames.filter(x=>x!==t.v);
      m.fx=fnOf(m.f.ast,E,t.v);
      try{m.dim=dimOf(m.f.ast,D).d;}catch(e){m.dimErr=e.message;}}
    return m;}
  m.lo=tp(st.lo,K);m.hi=tp(st.hi,K);m.pre=st.showPre?tp(st.pre,K):{empty:true};
  if(m.lo.err)m.errs.push(['Lower limit',m.lo.err]);
  if(m.hi.err)m.errs.push(['Upper limit',m.hi.err]);
  if(m.pre.err)m.errs.push(['Outside term',m.pre.err]);
  let v=st.v.trim();const am=v.match(/^(theta|omega|pi)$/);if(am)v=ALIAS[am[1]];
  m.v=v;m.vOk=vNames.includes(v);
  if(v&&!m.vOk)m.errs.push(['d□',`“${v}” isn’t one of the coordinates (${vNames.join(', ')}).`]);
  const lim=(fld,name)=>{if(!fld.ast)return null;if(hasSym(fld.ast,vNames)){m.errs.push([name,'A limit can only use the given quantities and numbers, not a coordinate.']);return null;}
    try{const x=ev(fld.ast,E);if(!isFinite(x)){m.errs.push([name,'This limit doesn’t give a finite number.']);return null;}return x;}catch(e){m.errs.push([name,e.message]);return null;}};
  m.loV=lim(m.lo,'Lower limit');m.hiV=lim(m.hi,'Upper limit');
  m.preV=0;
  if(m.pre.ast){if(hasSym(m.pre.ast,vNames))m.errs.push(['Outside term','A term outside the integral can’t use a coordinate.']);else{try{m.preV=ev(m.pre.ast,E);}catch(e){m.errs.push(['Outside term',e.message]);m.preV=NaN;}}}
  if(m.f.ast&&m.vOk){m.fx=fnOf(m.f.ast,E,v);
    try{m.fx(m.loV!=null?m.loV:0.5);}catch(e){if(e.user){m.errs.push(['Integrand',`${e.message} Only ${v} changes inside this integral.`]);m.fx=null;}}}
  if(m.fx&&m.loV!=null&&m.hiV!=null){
    let I=NaN;try{I=simpson(m.fx,m.loV,m.hiV,600);}catch(e){}
    if(!isFinite(I)){let bad=null;for(let i=0;i<=200;i++){const x=m.loV+(m.hiV-m.loV)*i/200;let y;try{y=m.fx(x);}catch(e){y=NaN;}if(!isFinite(y)){bad=x;break;}}
      m.errs.push(['Integrand',bad!=null?`It has no finite value at ${v} = ${fmt(bad)} (dividing by zero, or a root or log of a negative number?).`:'It doesn’t give a finite total between these limits.']);}
    else m.total=m.preV+I;}
  if(m.f.ast&&m.vOk){try{m.strip=addd(dimOf(m.f.ast,D).d,D[v]);
      if(m.lo.ast)m.loD=dimOf(m.lo.ast,D);if(m.hi.ast)m.hiD=dimOf(m.hi.ast,D);if(m.pre.ast)m.preD=dimOf(m.pre.ast,D).d;}catch(e){m.dimErr=e.message;}}
  return m;}

/* ---------- canvas helpers ---------- */
function prep(cv){const W=cv.clientWidth||300,H=cv.clientHeight||260,d=window.devicePixelRatio||1;
  if(cv.width!==Math.round(W*d)||cv.height!==Math.round(H*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d);}
  const g=cv.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,W,H);g.globalAlpha=1;g.setLineDash([]);return {g,W,H};}
function txt(g,s,x,y,col,align='left',size=12,math=false,base='middle'){g.fillStyle=col;g.font=`${math?'italic ':''}${size}px ${math?'"STIX Two Text",serif':'"IBM Plex Sans",sans-serif'}`;g.textAlign=align;g.textBaseline=base;g.fillText(s,x,y);}
function arrow(g,x1,y1,x2,y2,col,w=2,head=7){g.strokeStyle=col;g.fillStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
  const a=Math.atan2(y2-y1,x2-x1);if(Math.hypot(x2-x1,y2-y1)<2)return;g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-head*Math.cos(a-0.42),y2-head*Math.sin(a-0.42));g.lineTo(x2-head*Math.cos(a+0.42),y2-head*Math.sin(a+0.42));g.closePath();g.fill();}
function line(g,x1,y1,x2,y2,col,w=1.5,dash){g.strokeStyle=col;g.lineWidth=w;g.setLineDash(dash||[]);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();g.setLineDash([]);}
function bracketV(g,x,y1,y2,col){line(g,x,y1,x,y2,col,2);line(g,x-4,y1,x+4,y1,col,2);line(g,x-4,y2,x+4,y2,col,2);}
function bracketH(g,y,x1,x2,col){line(g,x1,y,x2,y,col,2);line(g,x1,y-4,x1,y+4,col,2);line(g,x2,y-4,x2,y+4,col,2);}
function niceTicks(a,b,n){const span=b-a;if(!(span>0))return [a];const s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),nm=s0/mag,step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;
  const t=[];for(let v=Math.ceil(a/step-1e-9)*step;v<=b+step*1e-9;v+=step)t.push(Math.abs(v)<step*1e-9?0:v);return t;}

/* ---------- plots ---------- */
function plot(cv,o){const {g,W,H}=prep(cv),c=colors(),L=62,R=16,T=26,B=34;
  if(o.msg){txt(g,o.msg,W/2,H/2,c.ink3,'center',13);return;}
  let [x0,x1]=o.xr;if(x0>x1)[x0,x1]=[x1,x0];if(!(x1>x0))x1=x0+1;
  const N=300,vals=[];
  const S=o.series.map(s=>{const p=[];for(let i=0;i<=N;i++){const x=x0+(x1-x0)*i/N;let y;try{y=s.f(x);}catch(e){y=NaN;}p.push(y);if(isFinite(y))vals.push(y);}return p;});
  let ymin=0,ymax=0;
  if(vals.length){vals.sort((a,b)=>a-b);const q=k=>vals[clamp(Math.floor(k*(vals.length-1)),0,vals.length-1)];ymin=Math.min(0,q(0.01));ymax=Math.max(0,q(0.99));}
  if(!(ymax-ymin>0)){ymax=ymin+1;}const pd=(ymax-ymin)*0.1;if(ymin<0)ymin-=pd;if(ymax>0)ymax+=pd;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);
  g.lineWidth=1;
  for(const v of niceTicks(x0,x1,4)){line(g,X(v),T,X(v),H-B,c.grid,1);txt(g,fmt(v,3),X(v),H-B+13,c.ink3,'center',11);}
  for(const v of niceTicks(ymin,ymax,4)){line(g,L,Y(v),W-R,Y(v),c.grid,1);txt(g,fmt(v,3),L-6,Y(v),c.ink3,'right',11);}
  line(g,L,Y(0),W-R,Y(0),c.ink3,1);line(g,L,T,L,H-B,c.rule,1);
  g.save();g.beginPath();g.rect(L,T,W-L-R,H-T-B);g.clip();
  if(o.gap){const [ia,ib]=o.gap.s,[ga,gb]=o.gap.xr;g.fillStyle=c.ref;g.globalAlpha=0.22;
    for(let i=0;i<N;i++){const xa=x0+(x1-x0)*i/N,xb=x0+(x1-x0)*(i+1)/N;if(xa<Math.min(ga,gb)||xb>Math.max(ga,gb))continue;
      const a1=S[ia][i],a2=S[ia][i+1],b1=S[ib][i],b2=S[ib][i+1];if(![a1,a2,b1,b2].every(isFinite))continue;
      g.beginPath();g.moveTo(X(xa),Y(a1));g.lineTo(X(xb),Y(a2));g.lineTo(X(xb),Y(b2));g.lineTo(X(xa),Y(b1));g.closePath();g.fill();}
    g.globalAlpha=1;}
  if(o.strips){const {f,n,a,b}=o.strips,dx=(b-a)/n;
    for(let i=0;i<n;i++){const xa=a+i*dx,xm=xa+dx/2;let y;try{y=f(xm);}catch(e){y=NaN;}if(!isFinite(y))continue;
      const px=X(Math.min(xa,xa+dx)),pw=Math.abs(X(xa+dx)-X(xa)),py=Math.min(Y(y),Y(0)),ph=Math.abs(Y(y)-Y(0));
      g.globalAlpha=0.16;g.fillStyle=c.acc;g.fillRect(px,py,pw,ph);g.globalAlpha=0.55;g.strokeStyle=c.acc;g.lineWidth=n>30?0.6:1;g.strokeRect(px,py,pw,ph);}
    g.globalAlpha=1;}
  o.series.forEach((s,k)=>{g.strokeStyle=s.col;g.lineWidth=s.w||2.4;g.setLineDash(s.dash||[]);g.beginPath();let on=false;
    for(let i=0;i<=N;i++){const y=S[k][i],x=x0+(x1-x0)*i/N;if(!isFinite(y)||Math.abs(Y(y))>1e5){on=false;continue;}if(on)g.lineTo(X(x),Y(y));else{g.moveTo(X(x),Y(y));on=true;}}
    g.stroke();g.setLineDash([]);});
  (o.tangents||[]).forEach(tg=>{if(!isFinite(tg.y)||!isFinite(tg.m))return;const sp=(x1-x0)*0.2;line(g,X(tg.x-sp),Y(tg.y-tg.m*sp),X(tg.x+sp),Y(tg.y+tg.m*sp),tg.col,2,tg.dash);});
  if(o.probe!=null&&isFinite(o.probe)){line(g,X(o.probe),T,X(o.probe),H-B,c.ink2,1,[4,4]);}
  (o.pts||[]).forEach(p=>{if(!isFinite(p.y))return;g.fillStyle=p.col;g.beginPath();g.arc(X(p.x),Y(p.y),4.5,0,7);g.fill();g.strokeStyle=c.panel;g.lineWidth=1.5;g.stroke();});
  g.restore();
  txt(g,o.yl||'',L,12,c.ink2,'left',12);txt(g,o.xl||'',W-R,H-8,c.ink2,'right',12);

/* ---------- checking ---------- */
function derCompare(m){const r=refOf(TPL[cur]);let scale=0;const pts=[];for(let i=0;i<=60;i++){const x=r.dom[0]+(r.dom[1]-r.dom[0])*i/60;const y=r.fx(x);scale=Math.max(scale,Math.abs(y));pts.push([x,y]);}
  let worst=0,wx=null,bad=false;for(const [x,y] of pts){let u;try{u=m.fx(x);}catch(e){u=NaN;}if(!isFinite(u)){bad=true;wx=x;break;}const e=Math.abs(u-y)/(Math.abs(y)+1e-3*scale);if(e>worst){worst=e;wx=x;}}
  return {worst,wx,bad};}
function check(){const t=TPL[cur],st=state(),m=M,r=refOf(t);
  if(m.errs.length){st.fb={k:'bad',h:`<p>Fix the expression first. ${m.errs[0][1]}</p>`};renderFeedback();return;}
  if(t.kind==='int'){
    if(!m.f.ast||!m.vOk||m.lo.empty||m.hi.empty){st.fb={k:'info',h:'<p>Fill in the integrand, both limits and the variable after <i class="mv">d</i>, then check.</p>'};renderFeedback();return;}
    if(!isFinite(m.total)){st.fb={k:'bad',h:'<p>Your set-up doesn’t give a finite number yet.</p>'};renderFeedback();return;}
    const rel=(m.total-r.ans)/Math.abs(r.ans),dimOk=!m.dimErr&&m.strip&&eqd(m.strip,t.ans.u)&&(!m.preD||eqd(m.preD,t.ans.u));
    if(Math.abs(rel)<2e-3&&dimOk){win(t,`${t.ans.lhs} = ${fmt(r.ans,4)} ${uName(t.ans.u)}`);return;}
    let msg=`<p>Not yet. Your set-up gives ${fmt(m.total,4)}, which is ${Math.abs(rel)<10?Math.round(Math.abs(rel)*100)+'%':fmt(Math.abs(rel)+1,3)+' times'} ${rel>0?'too high':'too low'}.</p>`;
    if(Math.abs(rel)<2e-3)msg=`<p>The number matches, but the units don’t: it should be in ${uName(t.ans.u)}.</p>`;
    else if(m.dimErr)msg+=`<p>There’s also a units problem: ${m.dimErr}.</p>`;
    else if(m.strip&&!eqd(m.strip,t.ans.u))msg+=`<p>Its units also come out as ${uName(m.strip)} instead of ${uName(t.ans.u)}.</p>`;
    st.fb={k:'bad',h:msg};renderFeedback();return;}
  if(!m.fx){st.fb={k:'info',h:'<p>Build your expression first, then check.</p>'};renderFeedback();return;}
  const cmp=derCompare(m),dimOk=!m.dimErr&&m.dim&&eqd(m.dim,t.ans.u);
  if(!cmp.bad&&cmp.worst<2e-3&&dimOk){win(t,'It matches the true rate everywhere in the range.');return;}
  let msg;if(cmp.bad)msg=`<p>Not yet. Your expression has no finite value at ${S(t.v)} = ${fmt(cmp.wx,3)}.</p>`;
  else if(cmp.worst<2e-3)msg=`<p>The values match, but the units should be ${uName(t.ans.u)}.</p>`;
  else msg=`<p>Not yet. Your expression is off by up to ${cmp.worst<10?Math.round(cmp.worst*100)+'%':'a factor of '+fmt(cmp.worst+1,2)} across the range of ${S(t.v)}.</p>`;
  if(!cmp.bad&&cmp.worst>=2e-3){if(m.dimErr)msg+=`<p>There’s also a units problem: ${m.dimErr}.</p>`;else if(m.dim&&!eqd(m.dim,t.ans.u))msg+=`<p>Its units also come out as ${uName(m.dim)} instead of ${uName(t.ans.u)}.</p>`;}
  st.fb={k:'bad',h:msg};renderFeedback();}
function win(t,line){const st=state();solved.add(t.id);saveSolved();renderList();
  st.fb={k:'good',h:`<p><b>Correct.</b> ${line}</p><p>Try new numbers to see that your set-up works for any values, or move on.</p><div class="row"><button class="btn" type="button" data-act="new">New numbers</button><button class="btn primary" type="button" data-act="next">Next problem</button></div>`};
  renderFeedback();}

function renderHints(){const t=TPL[cur],st=state(),m=M,r=refOf(t),out=[];
  $('#b-hint').textContent=st.hint>=3?'All hints shown':`Get a hint (${st.hint+1} of 3)`;$('#b-hint').disabled=st.hint>=3;
  $('#b-sol').hidden=st.hint<3;
  if(st.hint>=1){let h;
    if(t.kind==='int'){
      if(!m||!m.f.ast||!m.vOk)h=`Once your integrand and variable are in place, this hint checks units. ${t.ans.lhs} must come out in <b>${uName(t.ans.u)}</b>.`;
      else if(m.dimErr)h=`Inside your set-up ${m.dimErr}. Every term you add must have the same units.`;
      else{const ok=eqd(m.strip,t.ans.u);h=`Your strip, integrand × <i class="mv">d</i>${S(m.v)}, comes out in <b>${uName(m.strip)}</b>. ${t.ans.lhs} must be in <b>${uName(t.ans.u)}</b>. `+
        (ok?'They match, so if your result is still off, look at the shape of your integrand or at your limits.':'They don’t match, so a factor is missing, extra, or in the wrong place.');
        const vd=t.vars.find(v=>v[0]===m.v)[1];
        [['lower',m.loD],['upper',m.hiD]].forEach(([nm,d])=>{if(d&&!(d.c===0)&&!eqd(d.d,vd))h+=` Your ${nm} limit is in ${uName(d.d)}, but ${S(m.v)} is in ${uName(vd)}.`;});
        if(m.preD&&!eqd(m.preD,t.ans.u))h+=` Your outside term is in ${uName(m.preD)}.`;}}
    else{if(!m||!m.f.ast)h=`Once you’ve built an expression, this hint checks units. ${t.ans.lhs} must come out in <b>${uName(t.ans.u)}</b>.`;
      else if(m.dimErr)h=`Inside your expression ${m.dimErr}. Every term you add must have the same units.`;
      else{const ok=eqd(m.dim,t.ans.u);h=`Your expression comes out in <b>${uName(m.dim)}</b>. ${t.ans.lhs} must be in <b>${uName(t.ans.u)}</b>. `+(ok?'They match, so look at the shape of your expression next.':'They don’t match, so something is missing, extra, or in the wrong place.');}}
    out.push(['Hint 1 · Units',h]);}
  if(st.hint>=2){let h;
    if(t.kind==='int'){
      if(!m||!m.fx)h=`The amber curve shows a correct integrand when you slice along ${S(r.v)}. Build your integrand and limits to compare.`;
      else if(m.v!==r.v)h=`You slice along ${S(m.v)}. The reference slices along ${S(r.v)}, so the two curves can’t be laid on top of each other. Try slicing along ${S(r.v)} to compare, or rely on the units hint.`;
      else{const a=Math.min(r.lo,r.hi),b=Math.max(r.lo,r.hi);let worst=0,wx=null,sgn=0,scale=0;
        for(let i=0;i<=80;i++){const x=a+(b-a)*i/80;scale=Math.max(scale,Math.abs(r.fx(x)));}
        for(let i=0;i<=80;i++){const x=a+(b-a)*i/80;let u;try{u=m.fx(x);}catch(e){u=NaN;}const d=u-r.fx(x);if(isFinite(d)&&Math.abs(d)>worst){worst=Math.abs(d);wx=x;sgn=Math.sign(d);}}
        const vu=uLab(t.vars.find(v=>v[0]===r.v)[1]);
        h=`The dashed amber curve is a correct integrand for slicing along ${S(r.v)}, drawn over the range it should cover. The shaded band is the gap between yours and it.`+
          (worst<1e-3*scale?' Your integrand matches it. Compare the ranges: your limits are the problem.':` The biggest gap is near ${S(r.v)} = ${fmt(wx,3)} ${vu}, where yours is ${sgn>0?'higher':'lower'}.`);}}
    else h=`The dashed amber curve is the correct ${t.ans.lhs}, with the gap to yours shaded.${t.given?' On the given function, compare the true slope line with the one your expression implies.':''} Move the slider to see where they part.`;
    out.push(['Hint 2 · Shape',h]);}
  if(st.hint>=3)out.push(['Hint 3 · Set-up',t.hint]);
  let html=out.map(([l,h])=>`<div class="hint"><div class="hl">${l}</div><p>${h}</p></div>`).join('');
  if(st.showSol){const K=knownOf(t),s=t.sol;let body;
    if(t.kind==='int')body=`${t.ans.lhs} = ${s.pre?pp(parse(s.pre,K),1)+' + ':''}<span class="isig">∫</span><span class="ilim"><span>${pp(parse(s.hi,K))}</span><span>${pp(parse(s.lo,K))}</span></span>${pp(parse(s.f,K),1.5)} <i class="mv">d</i>${S(s.v)}`;
    else body=`${t.ans.lhs} = ${pp(parse(s.f,K))}`;
    html+=`<div class="sol"><div class="hl" style="font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)">One correct set-up</div><div class="preview">${body}</div><p style="margin:0;font-size:14px;color:var(--ink-2)">Other set-ups can be right too, as long as they add up the same thing.</p><div><button class="btn" type="button" id="b-use">Put it in the builder</button></div></div>`;}
  $('#hints').innerHTML=html;
  const bu=$('#b-use');if(bu)bu.onclick=useSolution;}
function useSolution(){const t=TPL[cur],st=state(),s=t.sol;st.f=s.f;if(t.kind==='int'){st.v=s.v;st.lo=s.lo;st.hi=s.hi;if(s.pre){st.showPre=true;st.pre=s.pre;}}renderProblem();update();}
function newNumbers(){const st=state();st.seed=1+Math.floor(Math.random()*1e9);st.fb=null;P=mkParams(TPL[cur],st.seed);renderProblem();update();}

/* ---------- wiring ---------- */
$('#b-check').onclick=check;
$('#b-hint').onclick=()=>{const st=state();if(st.hint<3)st.hint++;renderHints();update();};
$('#b-sol').onclick=()=>{state().showSol=true;renderHints();};
$('#b-new').onclick=newNumbers;
$('#b-pre').onclick=()=>{const st=state();st.showPre=!st.showPre;if(!st.showPre)st.pre='';renderProblem();update();};
$('#sl-p').addEventListener('input',e=>{probe=e.target.value/1000;schedule();});
$('#sl-n').addEventListener('input',e=>{nStrips=+e.target.value;$('#sl-n-o').textContent=nStrips;schedule();});
new ResizeObserver(()=>schedule()).observe($('#viz'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>schedule());
new MutationObserver(()=>schedule()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>schedule());

/* opens on the tank problem with an example attempt, so the bench shows what it does */
cur=TPL.findIndex(t=>t.id==='pump');
Object.assign(state(),{f:'ρ g π R^2 y',v:'y',lo:'0',hi:'H'});
P=mkParams(TPL[cur],state().seed);renderProblem();update();
$('#fb').innerHTML='<div class="fb info" role="status"><p>This is an example attempt, and it has a mistake. Edit it, or press Check to see how far off it is.</p></div>';
</script>
</body>
